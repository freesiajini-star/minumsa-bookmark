<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>봉산삼오전집 투명 책갈피 제작소</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .font-batang {
            font-family: 'Gowun Batang', serif;
        }

        .font-sans-kr {
            font-family: 'Noto Sans KR', sans-serif;
        }


        /* =========================================================
           실제 출력 규격
        ========================================================= */

        :root {
            --canvas-w: 1080px;
            --canvas-h: 1720px;

            --spine-w: 97px;
            --front-w: 983px;

            --image-h: 774px;
            --transparent-h: 946px;

            --main-color: #A61D4B;
        }


        /* =========================================================
           실제 디자인
        ========================================================= */

        .book-canvas {
            width: 1080px;
            height: 1720px;

            position: relative;

            display: flex;

            background: transparent;

            overflow: hidden;
        }


        /* =========================================================
           미리보기
        ========================================================= */

        .preview-frame {
            width: 502px;
            height: 800px;

            position: relative;

            overflow: hidden;

            flex-shrink: 0;

            background:
                repeating-conic-gradient(
                    #f1f5f9 0% 25%,
                    #ffffff 0% 50%
                )
                50% / 16px 16px;

            border-radius: 14px;
        }


        .preview-frame .book-canvas {
            transform: scale(0.465);
            transform-origin: top left;
        }


        /* =========================================================
           책등 세로쓰기
        ========================================================= */

        .spine-vertical {
            writing-mode: vertical-rl;

            text-orientation: upright;

            white-space: nowrap !important;

            word-break: keep-all !important;

            overflow: visible;

            display: block;

            width: max-content;

            height: max-content;

            max-width: none !important;

            max-height: none !important;

            flex-shrink: 0;
        }


        .minumsa-logo {
            display: block;

            object-fit: contain;

            object-position: center;

            flex-shrink: 0;
        }


        .color-chip {
            transition: transform 0.15s ease;
        }

        .color-chip.selected {
            transform: scale(1.1);
        }


    </style>
</head>



<body class="bg-slate-100 min-h-screen p-4 md:p-8">


<div
    class="max-w-[1400px] mx-auto bg-white rounded-2xl shadow-xl overflow-hidden
           grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_560px]"
>


    <!-- =============================================================
         설정
    ============================================================== -->

    <div
        class="p-6 md:p-8 flex flex-col justify-between
               border-b lg:border-b-0 lg:border-r border-slate-200"
    >

        <div class="space-y-4">

            <p class="text-xs text-slate-500">

            ====================================================== -->

            </div>

        </div>



        <button

    <!-- =============================================================

    ============================================================== -->

                <div

                        flex-shrink:0;

                >


                    <!-- 책등 상단 -->

                    <div

                            width:96px;

                            background:transparent;
                            display:flex;

                    <!-- 작가 사진 -->

                             책등 제목

                                    white-space:nowrap !important;
                                    width:auto;
                                    height:auto;
                                    max-height:none !important;
                                    max-width:none !important;

                                    color:#ffffff;
                                    font-size:42px;
                                    font-weight:700;
                                    line-height:1;
                                    letter-spacing:0;
                                    white-space:nowrap !important;
                                    width:43px;
                                    height:570px;
                                    overflow:hidden;
                                    max-height:none !important;
                                    max-width:none !important;

                                <span

</div>



<script>

    /* =============================================================
       요소
    ============================================================= */

    const seriesNoInput =
        document.getElementById('seriesNoInput');

    const commonTitleInput =
        document.getElementById('commonTitleInput');

    const engTitleInput =
        document.getElementById('engTitleInput');

    const authorInput =
        document.getElementById('authorInput');

    const translatorInput =
        document.getElementById('translatorInput');

    const imageInput =
        document.getElementById('imageInput');

    const authorImageSelect =
        document.getElementById('authorImageSelect');


    const previewSeriesNo =
        document.getElementById('previewSeriesNo');

    const previewSubSeriesNo =
        document.getElementById('previewSubSeriesNo');

    const previewSpineTitle =
        document.getElementById('previewSpineTitle');

    const previewSpineAuthor =
        document.getElementById('previewSpineAuthor');

    const previewBookTitle =
        document.getElementById('previewBookTitle');

    const previewEngTitle =
        document.getElementById('previewEngTitle');

    const previewAuthor =
        document.getElementById('previewAuthor');

    const previewTranslator =
        document.getElementById('previewTranslator');

    const previewImage =
        document.getElementById('previewImage');

    const imagePlaceholder =
        document.getElementById('imagePlaceholder');

    const portraitImg =
        document.getElementById('portraitImg');

    const spineColorBox =
        document.getElementById('spineColorBox');

    const spineAuthorBox =
        document.getElementById('spineAuthorBox');

    const topBar =
        document.getElementById('topBar');

    const bottomBar =
        document.getElementById('bottomBar');

    const colorChips =
        document.querySelectorAll('.color-chip');

    const downloadBtn =
        document.getElementById('downloadBtn');

    const previewFrame =
        document.getElementById('previewFrame');

    const captureArea =
        document.getElementById('captureArea');



    /* =============================================================
       번호

       88  → 088
       7   → 007
       123 → 123
    ============================================================= */

    function formatSeriesNo(value) {

        const cleaned =
            String(value ?? '')
                .replace(/\D/g, '');

        if (!cleaned) {
            return '001';
        }

        const number =
            parseInt(cleaned, 10);

        if (
            isNaN(number) ||
            number <= 0
        ) {
            return '001';
        }

        return String(
            Math.min(number, 999)
        ).padStart(3, '0');
    }



    /* =============================================================
       번호 변경
    ============================================================= */

    function updateSeriesNumber() {

        const value =
            formatSeriesNo(
                seriesNoInput.value
            );

        previewSeriesNo.textContent =
            value;

        previewSubSeriesNo.textContent =
            value;
    }


    seriesNoInput.addEventListener(
        'input',
        updateSeriesNumber
    );



    /* =============================================================
       책등 인물
    ============================================================= */

    authorImageSelect.addEventListener(
        'change',
        function(e) {

            portraitImg.src =
                e.target.value;

        }
    );



    /* =============================================================
       앞표지 제목 크기
    ============================================================= */

    function fitTitleAndBars() {

        const MAX_WIDTH = 700;

        const MIN_FONT_SIZE = 42;

        const NORMAL_FONT_SIZE = 83;

        let fontSize =
            NORMAL_FONT_SIZE;


        previewBookTitle.style.whiteSpace =
            'nowrap';

        previewBookTitle.style.display =
            'block';

        previewBookTitle.style.webkitLineClamp =
            'unset';

        previewBookTitle.style.width =
            MAX_WIDTH + 'px';

        previewBookTitle.style.fontSize =
            fontSize + 'px';

        previewBookTitle.style.lineHeight =
            '1';

        previewBookTitle.style.overflow =
            'hidden';


        while (
            previewBookTitle.scrollWidth > MAX_WIDTH &&
            fontSize > MIN_FONT_SIZE
        ) {

            fontSize -= 1;

            previewBookTitle.style.fontSize =
                fontSize + 'px';
        }


        if (
            previewBookTitle.scrollWidth > MAX_WIDTH
        ) {

            previewBookTitle.style.whiteSpace =
                'normal';

            previewBookTitle.style.display =
                '-webkit-box';

            previewBookTitle.style.webkitBoxOrient =
                'vertical';

            previewBookTitle.style.webkitLineClamp =
                '2';

            previewBookTitle.style.lineHeight =
                '0.88';

            previewBookTitle.style.width =
                MAX_WIDTH + 'px';

            previewBookTitle.style.overflow =
                'hidden';

        } else {

            previewBookTitle.style.whiteSpace =
                'nowrap';

            previewBookTitle.style.display =
                'block';

            previewBookTitle.style.webkitLineClamp =
                'unset';

            previewBookTitle.style.lineHeight =
                '1';

        }


        const titleWidth =
            Math.min(
                MAX_WIDTH,
                Math.max(
                    100,
                    previewBookTitle.scrollWidth
                )
            );


        const finalBarWidth =
            Math.min(
                900,
                Math.max(
                    700,
                    titleWidth
                )
            );


        topBar.style.width =
            finalBarWidth + 'px';

        bottomBar.style.width =
            finalBarWidth + 'px';


        previewEngTitle.style.maxWidth =
            Math.max(
                50,
                finalBarWidth - 42
            ) + 'px';

    }



    /* =============================================================
       책등 제목 1열 / 2열 자동 처리

       ① 우선 64px 1열로 시작
       ② 610px 안에 들어오면 1열 유지
       ③ 42px까지 줄여도 너무 길면 2열 전환
       ④ 2열에서는 제목을 반으로 나누어 표시
       ⑤ 두 열 모두 570px 안에 들어오도록 자동 축소
    ============================================================= */

    function splitSpineTitle(value) {

        const clean =
            String(value || '')
                .replace(/\s+/g, ' ')
                .trim();

        if (!clean) {
            return ['', ''];
        }

        const chars =
            Array.from(clean);

        const middle =
            Math.ceil(chars.length / 2);

        return [
            chars.slice(0, middle).join(''),
            chars.slice(middle).join('')
        ];
    }



    function fitSpineTitle() {

        const title =
            commonTitleInput.value ||
            '오만과 편견';

        const titleBox =
            document.getElementById(
                'spineTitleBox'
            );

        const title2 =
            document.getElementById(
                'previewSpineTitle2'
            );


        const MAX_HEIGHT_SINGLE =
            610;

        const MIN_FONT_SINGLE =
            42;

        const MAX_FONT_SINGLE =
            64;


        /* ---------------------------------------------------------
           우선 1열로 맞춘다.
        --------------------------------------------------------- */

        titleBox.style.flexDirection =
            'row';

        title2.style.display =
            'none';

        previewSpineTitle.style.display =
            'block';

        previewSpineTitle.textContent =
            title;

        previewSpineTitle.style.fontSize =
            MAX_FONT_SINGLE + 'px';

        previewSpineTitle.style.width =
            'auto';

        previewSpineTitle.style.height =
            'auto';

        previewSpineTitle.style.overflow =
            'visible';


        let singleFont =
            MAX_FONT_SINGLE;


        while (
            previewSpineTitle.getBoundingClientRect().height >
                MAX_HEIGHT_SINGLE &&
            singleFont >
                MIN_FONT_SINGLE
        ) {

            singleFont -= 1;

            previewSpineTitle.style.fontSize =
                singleFont + 'px';
        }



        /* ---------------------------------------------------------
           42px에서도 610px를 넘으면 2열.
        --------------------------------------------------------- */

        if (
            previewSpineTitle.getBoundingClientRect().height >
            MAX_HEIGHT_SINGLE
        ) {

            const parts =
                splitSpineTitle(title);

            const first =
                parts[0];

            const second =
                parts[1];


            previewSpineTitle.textContent =
                first;

            title2.textContent =
                second;


            previewSpineTitle.style.fontSize =
                '42px';

            title2.style.fontSize =
                '42px';


            previewSpineTitle.style.width =
                '43px';

            previewSpineTitle.style.height =
                '570px';

            previewSpineTitle.style.overflow =
                'hidden';


            title2.style.width =
                '43px';

            title2.style.height =
                '570px';

            title2.style.overflow =
                'hidden';


            title2.style.display =
                'block';


            /* -----------------------------------------------------
               두 열의 실제 높이를 확인하면서
               같은 크기로 함께 줄인다.
            ----------------------------------------------------- */

            let twoColumnFont =
                42;


            while (
                (
                    previewSpineTitle.scrollHeight > 570 ||
                    title2.scrollHeight > 570
                ) &&
                twoColumnFont > 25
            ) {

                twoColumnFont -= 1;

                previewSpineTitle.style.fontSize =
                    twoColumnFont + 'px';

                title2.style.fontSize =
                    twoColumnFont + 'px';
            }


            /* -----------------------------------------------------
               세로쓰기에서는 첫 번째 열이 오른쪽에 오도록 한다.
            ----------------------------------------------------- */

            titleBox.style.flexDirection =
                'row-reverse';

        } else {

            titleBox.style.flexDirection =
                'row';

        }

    }



    /* =============================================================
       책등 저자 위치

       제목과 완전히 독립.
       긴 제목이어도 저자는 항상 700px에서 시작한다.
    ============================================================= */

    function fitSpineAuthor() {

        spineAuthorBox.style.top =
            '700px';
    }



    /* =============================================================
       제목
    ============================================================= */

    commonTitleInput.addEventListener(
        'input',
        function(e) {

            const value =
                e.target.value ||
                '오만과 편견';


            previewBookTitle.textContent =
                value;


            previewSpineTitle.textContent =
                value;


            fitTitleAndBars();

            fitSpineTitle();

            fitSpineAuthor();

        }
    );



    /* =============================================================
       영문 제목
    ============================================================= */

    engTitleInput.addEventListener(
        'input',
        function(e) {

            previewEngTitle.textContent =
                e.target.value ||
                'Pride and Prejudice';

        }
    );



    /* =============================================================
       저자
    ============================================================= */

    authorInput.addEventListener(
        'input',
        function(e) {

            const value =
                e.target.value ||
                '제인 오스틴';


            previewAuthor.textContent =
                value;


            previewSpineAuthor.textContent =
                value;


            fitSpineAuthor();

        }
    );



    /* =============================================================
       역자
    ============================================================= */

    translatorInput.addEventListener(
        'input',
        function(e) {

            previewTranslator.textContent =
                e.target.value;

        }
    );



    /* =============================================================
       이미지 업로드

       AVIF 포함
    ============================================================= */

    imageInput.addEventListener(
        'change',
        function(e) {

            const file =
                e.target.files[0];


            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    previewImage.onload =
                        function() {

                            previewImage.style.display =
                                'block';

                            imagePlaceholder.style.display =
                                'none';

                        };


                    previewImage.src =
                        event.target.result;

                };


            reader.readAsDataURL(file);

        }
    );



    /* =============================================================
       색상
    ============================================================= */

    colorChips.forEach(
        function(chip) {

            chip.addEventListener(
                'click',
                function() {


                    colorChips.forEach(
                        function(c) {

                            c.classList.remove(
                                'selected',
                                'ring-2',
                                'ring-indigo-600',
                                'ring-offset-2'
                            );

                        }
                    );


                    chip.classList.add(
                        'selected',
                        'ring-2',
                        'ring-indigo-600',
                        'ring-offset-2'
                    );


                    const color =
                        chip.dataset.color;


                    spineColorBox.style.backgroundColor =
                        color;

                    topBar.style.backgroundColor =
                        color;

                    bottomBar.style.backgroundColor =
                        color;

                }
            );

        }
    );



    /* =============================================================
       이미지 로딩 대기
    ============================================================= */

    function waitForImages(container) {

        const images =
            container.querySelectorAll('img');


        return Promise.all(

            Array.from(images).map(
                function(img) {

                    if (
                        img.complete &&
                        img.naturalWidth > 0
                    ) {

                        return Promise.resolve();

                    }


                    return new Promise(
                        function(resolve) {

                            const done =
                                function() {
                                    resolve();
                                };


                            img.addEventListener(
                                'load',
                                done,
                                { once:true }
                            );


                            img.addEventListener(
                                'error',
                                done,
                                { once:true }
                            );

                        }
                    );

                }
            )

        );

    }



    /* =============================================================
       미리보기 렌더링을 그대로 저장

       ★★★★★ 핵심 ★★★★★

       미리보기 프레임 자체를 캡처하여
       화면에 보이는 레이아웃을 그대로 저장한다.
    ============================================================= */

    downloadBtn.addEventListener(
        'click',
        async function() {

            downloadBtn.disabled =
                true;


            downloadBtn.textContent =
                '✨ PNG 생성 중...';


            try {


                /* -----------------------------------------
                   번호를 저장 직전에 다시 읽음
                ----------------------------------------- */

                const fileNumber =
                    formatSeriesNo(
                        seriesNoInput.value
                    );


                /* 화면의 번호도 확실히 동기화 */

                previewSeriesNo.textContent =
                    fileNumber;

                previewSubSeriesNo.textContent =
                    fileNumber;



                /* -----------------------------------------
                   폰트 로딩
                ----------------------------------------- */

                if (document.fonts) {
                    await document.fonts.ready;
                }



                /* -----------------------------------------
                   이미지 로딩
                ----------------------------------------- */

                await waitForImages(
                    captureArea
                );



                /* -----------------------------------------
                   레이아웃 안정화
                ----------------------------------------- */

                await new Promise(
                    function(resolve) {

                        requestAnimationFrame(
                            function() {

                                requestAnimationFrame(
                                    resolve
                                );

                            }
                        );

                    }
                );



                /* -----------------------------------------
                   실제 미리보기 크기
                ----------------------------------------- */

                const previewWidth =
                    502;

                const previewHeight =
                    800;



                /* -----------------------------------------
                   미리보기 프레임의
                   체크무늬 배경을 없애고
                   투명으로 캡처
                ----------------------------------------- */

                const oldBackground =
                    previewFrame.style.background;

                const oldBorderRadius =
                    previewFrame.style.borderRadius;


                previewFrame.style.background =
                    'transparent';

                previewFrame.style.borderRadius =
                    '0';



                /* -----------------------------------------
                   고해상도로 미리보기 캡처
                ----------------------------------------- */

                const renderScale =
                    4;


                const previewCanvas =
                    await html2canvas(
                        previewFrame,
                        {

                            width:
                                previewWidth,

                            height:
                                previewHeight,

                            scale:
                                renderScale,

                            backgroundColor:
                                null,

                            useCORS:
                                true,

                            allowTaint:
                                false,

                            imageTimeout:
                                0,

                            logging:
                                false,

                            removeContainer:
                                true

                        }
                    );



                /* -----------------------------------------
                   미리보기 원상복구
                ----------------------------------------- */

                previewFrame.style.background =
                    oldBackground;

                previewFrame.style.borderRadius =
                    oldBorderRadius;



                /* -----------------------------------------
                   최종 1080×1720 PNG 생성
                ----------------------------------------- */

                const finalCanvas =
                    document.createElement('canvas');


                finalCanvas.width =
                    1080;

                finalCanvas.height =
                    1720;


                const ctx =
                    finalCanvas.getContext('2d');


                ctx.clearRect(
                    0,
                    0,
                    1080,
                    1720
                );


                /*
                 * 체크무늬가 아닌
                 * 실제 투명 배경 위의 디자인만
                 * 확대해서 넣는다.
                 */

                ctx.drawImage(
                    previewCanvas,
                    0,
                    0,
                    previewCanvas.width,
                    previewCanvas.height,
                    0,
                    0,
                    1080,
                    1720
                );



                /* -----------------------------------------
                   Blob 방식으로 다운로드
                ----------------------------------------- */

                const blob =
                    await new Promise(
                        function(resolve) {

                            finalCanvas.toBlob(
                                resolve,
                                'image/png'
                            );

                        }
                    );


                if (!blob) {
                    throw new Error(
                        'PNG Blob 생성 실패'
                    );
                }



                /* -----------------------------------------
                   파일명

                   예:
                   북커버_088.png
                ----------------------------------------- */

                const fileName =
                    '북커버_' +
                    fileNumber +
                    '.png';



                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement('a');


                link.href =
                    url;


                link.download =
                    fileName;


                link.setAttribute(
                    'download',
                    fileName
                );


                link.style.display =
                    'none';


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    function() {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );

            }


            catch(error) {

                console.error(
                    'PNG 생성 오류:',
                    error
                );


                alert(
                    'PNG 생성 중 오류가 발생했습니다.\n' +
                    '잠시 후 다시 시도해주세요.'
                );

            }


            finally {

                downloadBtn.disabled =
                    false;

                downloadBtn.textContent =
                    '✨ 고화질 투명 PNG 다운로드';

            }

        }
    );



    /* =============================================================
       최초 실행
    ============================================================= */

    async function initialize() {

        if (document.fonts) {
            await document.fonts.ready;
        }


        updateSeriesNumber();

        fitTitleAndBars();

        fitSpineTitle();

        fitSpineAuthor();

    }


    window.addEventListener(
        'load',
        initialize
    );


</script>
