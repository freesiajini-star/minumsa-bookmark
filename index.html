<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>삼삼오오전집 투명 책갈피 제작소</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');


        /* =========================================================
           기본
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .font-batang {
            font-family: 'Gowun Batang', serif;
        }

        .font-sans-kr {
            font-family: 'Noto Sans KR', sans-serif;
        }


        /* =========================================================
           실제 출력 규격

           스냅스 포토카드
           54 : 86

           1080 × 1720
        ========================================================= */

        :root {

            --canvas-w: 1080px;
            --canvas-h: 1720px;

            /* 책등 */
            --spine-w: 97px;

            /* 앞표지 */
            --front-w: 983px;

            /* 일러스트 = 전체 높이의 40% */
            --image-h: 688px;

            /* 기본 컬러 */
            --main-color: #A61D4B;
        }


        /* =========================================================
           실제 출력 캔버스

           ★ 배경 투명
        ========================================================= */

        .book-canvas {

            width: var(--canvas-w);
            height: var(--canvas-h);

            position: relative;

            display: flex;

            background: transparent;

            overflow: hidden;
        }


        /* =========================================================
           실시간 미리보기

           실제 캔버스 1080×1720을 약 1.5배 크게 표시
        ========================================================= */

        .preview-frame {

            width: 502px;
            height: 800px;

            position: relative;

            overflow: hidden;

            flex-shrink: 0;

            background:
                repeating-conic-gradient(
                    #f1f5f9 0% 25%,
                    #ffffff 0% 50%
                )
                50% / 16px 16px;

            border-radius: 14px;
        }

        .preview-frame .book-canvas {

            transform: scale(0.465);

            transform-origin: top left;
        }


        /* =========================================================
           책등 세로쓰기

           ★ 절대 줄바꿈되지 않음
           ★ 2열 방지
        ========================================================= */

        .spine-vertical {

            writing-mode: vertical-rl;

            text-orientation: upright;

            white-space: nowrap !important;

            word-break: keep-all !important;

            overflow: visible;

            display: block;

            width: max-content;

            height: max-content;

            max-width: none !important;

            max-height: none !important;

            flex-shrink: 0;
        }


        /* =========================================================
           민음사 로고
        ========================================================= */

        .minumsa-logo {

            display: block;

            object-fit: contain;

            object-position: center;

            flex-shrink: 0;
        }


        /* =========================================================
           컬러 버튼
        ========================================================= */

        .color-chip {
            transition: transform 0.15s ease;
        }

        .color-chip.selected {
            transform: scale(1.1);
        }

    </style>
</head>


<body class="bg-slate-100 min-h-screen p-4 md:p-8">


<div
    class="max-w-[1400px] mx-auto bg-white rounded-2xl shadow-xl overflow-hidden
           grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_560px]"
>


    <!-- =============================================================
         왼쪽 설정
    ============================================================== -->

    <div
        class="p-6 md:p-8 flex flex-col justify-between
               border-b lg:border-b-0 lg:border-r border-slate-200"
    >

        <div class="space-y-4">


            <h1 class="text-2xl font-bold text-slate-800">
                📚 삼삼오오전집 투명 책갈피
            </h1>


            <p class="text-xs text-slate-500">

            <!-- 제작자 -->

                <label class="block text-sm font-semibold text-slate-700 mb-1">
                    제작자 정보
                </label>

                    type="text"
                    id="studentInfoInput"
                    placeholder="3학년 5반 홍길동"

                    type="file"
                    id="imageInput"
                    accept="image/*"

                           file:rounded-full file:border-0

            <!-- 번호 / 인물 -->

                        전집 번호
                    </label>

                </div>


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        책등 인물
                    </label>

                    <select
                        id="authorImageSelect"
                        class="w-full px-3 py-2 border rounded-lg outline-none
                               bg-white text-sm"
                    >

                            제인 오스틴
                        </option>

                        <option value="Hankang.png">
                            한강 작가
                        </option>

                        <option value="Sejong.png">
                            세종대왕
                        </option>

                        <option value="Shakespeare.png">
                            셰익스피어
                        </option>

                        <option value="Hwang.png">
                            황석영 작가
                        </option>

                    </select>

                </div>

            </div>


            <!-- 제목 -->

            <div class="grid grid-cols-2 gap-3">

                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        책 제목
                    </label>

                <div>

                        영문 원제
                    </label>

                    <input
                        type="text"
                        id="engTitleInput"
                        value="Pride and Prejudice"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>

            </div>


            <!-- 저자 / 역자 -->

            <div class="grid grid-cols-2 gap-3">

                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        저자명
                    </label>

                    </label>

                    <input

            </div>


            <!-- 색상 -->

            <div>

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    책등 & 띠 컬러
                </label>


                <div class="flex flex-wrap gap-2.5">


                    <button
                        type="button"
                        class="color-chip selected w-8 h-8 rounded-full
                               border-2 border-white shadow-md
                               ring-2 ring-indigo-600 ring-offset-2"
                        style="background:#A61D4B"
                        data-color="#A61D4B"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#1E3A8A"
                        data-color="#1E3A8A"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#065F46"
                        data-color="#065F46"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#581C87"
                        data-color="#581C87"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#B45309"
                        data-color="#B45309"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#111827"
                        data-color="#111827"
                    ></button>


                    <button
                        type="button"

                               border-2 border-white shadow-md"
                        style="background:#0369A1"
                        data-color="#0369A1"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#9A3412"
                        data-color="#9A3412"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#4D7C0F"
                        data-color="#4D7C0F"
                    ></button>


                </div>

            </div>

        </div>


        <!-- 다운로드 -->

        <button
            id="downloadBtn"
            class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700
                   text-white font-semibold py-3 rounded-xl
                   transition shadow-md"
        >
            ✨ 고화질 투명 PNG 다운로드
        </button>

    </div>



    <!-- =============================================================
         오른쪽 미리보기
    ============================================================== -->

    <div
        class="p-6 md:p-8 bg-slate-50 flex flex-col
               items-center justify-start overflow-auto"
    >

        <p class="text-xs font-medium text-slate-400 mb-3">
            실시간 미리보기 · 54:86 · 일러스트 40%
        </p>


        <div class="preview-frame">


            <!-- =====================================================
                 실제 1080 × 1720
            ====================================================== -->

            <div
                id="captureArea"
                class="book-canvas"
            >


                <!-- =================================================
                     ★★★★★ 책등 ★★★★★

                     97 × 1720

                ================================================== -->

                <div
                    id="spine"
                    style="
                        width:97px;
                        height:1720px;

                        position:relative;

                        flex-shrink:0;

                        background:#ffffff;

                        border-right:1px solid #cbd5e1;
                    "
                >


                    <!-- =================================================
                         책등 상단

                         ★ 작가 사진 바로 아래에 컬러가 붙도록
                           사진과 컬러 영역 사이에 빈 공간 없음
                    ================================================== -->

                    <div
                        style="
                            position:absolute;

                            top:0;
                            left:0;

                            width:97px;
                            height:320px;

                            background:#ffffff;
                        "
                    >


                        <!-- 번호 -->

                        <div
                            class="font-sans-kr"
                            style="
                                position:absolute;

                                top:25px;
                                left:0;

                                width:97px;

                                text-align:center;

                                font-size:17px;
                                font-weight:700;

                                color:#111111;
                            "
                        >

                            <span id="previewSeriesNo">
                                088
                            </span>

                        </div>


                        <!-- 세계문학전집 -->

                        <div
                            class="font-sans-kr"
                            style="
                                position:absolute;

                                top:63px;
                                left:0;

                                width:97px;

                                text-align:center;

                                font-size:13px;

                                line-height:1.25;

                                font-weight:700;

                                color:#111111;
                            "
                        >

                            세계<br>
                            문학<br>
                            전집

                        </div>


                        <!-- =================================================
                             작가 사진

                             ★ 책등 컬러 영역 바로 위
                             ★ 아래에 빈 공간 없음
                        ================================================== -->

                        <div
                            style="
                                position:absolute;

                                top:170px;
                                left:0;

                                width:97px;
                                height:150px;

                                overflow:hidden;

                                background:#e5e7eb;
                            "
                        >

                            <img
                                id="portraitImg"
                                src="Jane.png"
                                alt="작가 초상"
                                style="
                                    display:block;

                                    width:100%;
                                    height:100%;

                                    object-fit:cover;

                                    filter:
                                        grayscale(100%)
                                        contrast(115%);
                                "
                            >

                        </div>


                    </div>



                    <!-- =================================================
                         ★★★★★ 책등 컬러 영역 ★★★★★

                         top = 320px

                         → 작가 사진의 끝과 정확히 맞닿음

                         따라서 중간 흰색 여백 없음
                    ================================================== -->

                    <div
                        id="spineColorBox"
                        style="
                            position:absolute;

                            top:320px;
                            left:0;

                            width:97px;
                            height:1140px;

                            background:#A61D4B;

                            overflow:hidden;
                        "
                    >


                        <!-- =================================================
                             큰 책 제목

                             ★ 세로 한 줄
                             ★ 2열 금지
                        ================================================== -->

                        <div
                            style="
                                position:absolute;

                                top:48px;
                                left:0;

                                width:97px;

                                display:flex;

                                justify-content:center;
                            "
                        >

                            <span
                                id="previewSpineTitle"
                                class="spine-vertical font-batang"
                                style="
                                    color:#ffffff;

                                    font-size:30px;

                                    font-weight:700;

                                    line-height:1;

                                    letter-spacing:0.02em;

                                    white-space:nowrap !important;

                                    max-height:none !important;
                                "
                            >
                                오만과 편견
                            </span>

                        </div>


                        <!-- =================================================
                             작은 저자

                             ★ 제목 아래
                             ★ 제목보다 작음
                             ★ 역시 한 줄
                        ================================================== -->

                        <div
                            id="spineAuthorBox"
                            style="
                                position:absolute;

                                top:690px;
                                left:0;

                                width:97px;

                                display:flex;

                                justify-content:center;
                            "
                        >

                            <span
                                id="previewSpineAuthor"
                                class="spine-vertical font-sans-kr"

                                    color:#ffffff;

                                    font-size:16px;

                                    font-weight:500;

                                    line-height:1;

                                    letter-spacing:0.08em;

                                    white-space:nowrap !important;

                                    max-height:none !important;
                                "
                            >
                                제인 오스틴
                            </span>

                        </div>


                    </div>



                    <!-- =================================================
                         책등 하단

                         ★ 컬러 영역 바로 아래
                         ★ 민음사
                    ================================================== -->

                    <div
                        style="
                            position:absolute;

                            left:0;
                            bottom:0;

                            width:97px;
                            height:260px;

                            background:#ffffff;

                            display:flex;

                            align-items:flex-end;

                            justify-content:center;

                            padding-bottom:58px;
                        "
                    >

                        <img
                            src="./minumsa.png"
                            alt="민음사"
                            class="minumsa-logo"
                            style="
                                width:70px;
                                height:40px;
                            "
                        >

                    </div>


                </div>



                <!-- =================================================
                     ★★★★★ 앞표지 ★★★★★

                     983 × 1720
                ================================================== -->

                <div
                    id="frontCover"
                    style="
                        width:983px;
                        height:1720px;

                        position:relative;

                        flex-shrink:0;

                    "
                >


                    <!-- =================================================
                         ★ 일러스트 영역

                         전체 높이의 정확히 40%

                            left:0;

                            id="previewImage"

                            left:0;

                            width:983px;
                            height:1032px;

                            background:transparent;

                    >


                        <!-- =================================================
                             앞표지 텍스트
                        ================================================== -->

                                position:absolute;

                                top:42px;

                        >


                            <!-- 세계문학전집 -->

                                class="font-sans-kr"
                                style="
                                    margin-left:17px;

                                    font-size:22px;

                                    line-height:1;

                                    font-weight:700;

                                    color:#111111;

                            >

                                세계문학전집

                                <span id="previewSubSeriesNo">
                                    088
                                </span>

                            </div>


                            <!-- =================================================
                                 위쪽 색띠

                                 ★ JS가 제목 길이에 맞춰 자동 조절
                            ================================================== -->

                            <div
                                id="topBar"
                                style="
                                    width:500px;

                                    height:55px;

                                    margin-top:28px;

                                    background:#A61D4B;
                                "
                            >
                            </div>


                            <!-- =================================================
                                 제목

                                 ★ JS가 글자 크기와 색띠 길이를 자동 조절
                            ================================================== -->

                            <div
                                id="previewBookTitle"
                                class="font-batang"
                                style="
                                    width:650px;

                                    margin-top:28px;
                                    margin-bottom:29px;

                                    font-size:69px;

                                    line-height:1.15;

                                    font-weight:400;

                                    letter-spacing:-0.055em;

                                    color:#111111;

                                    word-break:keep-all;

                                    white-space:nowrap;

                            >
                                오만과 편견

                            <!-- =================================================
                                 아래쪽 색띠

                                 ★ 위쪽 색띠와 항상 같은 길이
                            ================================================== -->

                            <div
                                id="bottomBar"
                                style="
                                    width:500px;

                                    height:55px;

                                    display:flex;

                                    padding-left:21px;

                                    background:#A61D4B;

                            >

                                <span
                                    id="previewEngTitle"

                                        font-size:19px;

                                        font-weight:500;

                                        white-space:nowrap;

                                        overflow:hidden;

                                        text-overflow:ellipsis;

                                        max-width:455px;
                                    "
                                >
                                    Pride and Prejudice
                                </span>

                            </div>


                            <!-- =================================================
                                 저자 / 역자
                            ================================================== -->

                            <div
                                class="font-sans-kr"
                                style="
                                    display:flex;

                                    align-items:baseline;

                                    margin-top:29px;

                                    margin-left:17px;
                                "
                            >

                                <span
                                    id="previewAuthor"
                                    style="
                                        font-size:27px;

                                        font-weight:700;

                                        color:#111111;

                                        white-space:nowrap;

                                >
                                    제인 오스틴

                                <span
                                    id="previewTranslator"

                                        font-size:18px;

                                        font-weight:400;

                                        color:#111111;

                                        margin-left:17px;

                                        white-space:nowrap;
                                    "
                                >
                                    윤지관, 전승희 옮김
                                </span>

                            </div>


                            <!-- 제작자 -->

                            <div
                                class="font-sans-kr"
                                style="
                                    margin-top:14px;

                                    margin-left:17px;

                                    font-size:18px;

                                    color:#64748b;
                                "
                            >

                                <span id="previewStudentInfo">
                                    3학년 5반 홍길동
                                </span>

                            </div>


                        </div>



                        <!-- =================================================
                             앞표지 하단 민음사

                             ★ PNG
                             ★ 주변은 투명
                        ================================================== -->

                        <div
                            style="
                                position:absolute;

                                left:59px;
                                bottom:61px;

                                display:flex;

                                align-items:center;
                            "
                        >

                            <img
                                src="./minumsa.png"
                                alt="민음사"
                                class="minumsa-logo"
                                style="
                                    width:76px;
                                    height:42px;
                                "
                            >

                        </div>


                    </div>


                </div>


            </div>

        </div>


        <p class="text-[11px] text-slate-400 mt-4 text-center">
            ※ 최종 PNG 1080×1720px · 54:86 · 빈 공간 투명
        </p>

    </div>

</div>



<script>


    /* =============================================================
       입력 요소
    ============================================================= */

    const studentInfoInput =
        document.getElementById('studentInfoInput');

    const seriesNoInput =
        document.getElementById('seriesNoInput');

    const commonTitleInput =
        document.getElementById('commonTitleInput');

    const engTitleInput =
        document.getElementById('engTitleInput');

    const authorInput =
        document.getElementById('authorInput');

    const translatorInput =
        document.getElementById('translatorInput');

    const imageInput =
        document.getElementById('imageInput');

    const authorImageSelect =
        document.getElementById('authorImageSelect');


    /* =============================================================
       미리보기
    ============================================================= */

    const previewSeriesNo =
        document.getElementById('previewSeriesNo');

    const previewSubSeriesNo =
        document.getElementById('previewSubSeriesNo');

    const previewSpineTitle =
        document.getElementById('previewSpineTitle');

    const previewSpineAuthor =
        document.getElementById('previewSpineAuthor');

    const previewBookTitle =
        document.getElementById('previewBookTitle');

    const previewEngTitle =
        document.getElementById('previewEngTitle');

    const previewAuthor =
        document.getElementById('previewAuthor');

    const previewTranslator =
        document.getElementById('previewTranslator');

    const previewStudentInfo =
        document.getElementById('previewStudentInfo');

    const previewImage =
        document.getElementById('previewImage');

    const imagePlaceholder =
        document.getElementById('imagePlaceholder');

    const portraitImg =
        document.getElementById('portraitImg');

    const spineAuthorBox =
        document.getElementById('spineAuthorBox');


    /* =============================================================
       색상
    ============================================================= */

    const spineColorBox =
        document.getElementById('spineColorBox');

    const topBar =
        document.getElementById('topBar');

    const bottomBar =
        document.getElementById('bottomBar');

    const colorChips =
        document.querySelectorAll('.color-chip');


    /* =============================================================
       다운로드
    ============================================================= */

    const downloadBtn =
        document.getElementById('downloadBtn');

    const captureArea =
        document.getElementById('captureArea');



    /* =============================================================
       번호 포맷
    ============================================================= */

    function formatSeriesNo(value) {

        const number =
            parseInt(value, 10);

        if (
            isNaN(number) ||
            number <= 0
        ) {
            return '001';
        }

        return String(number).padStart(3, '0');
    }



    /* =============================================================
       제목 + 색띠 자동 조절

       핵심 기능

       1. 제목이 색띠보다 길어지지 않게 함
       2. 현재 제목 길이에 맞춰 색띠 길이를 늘림
       3. 위/아래 색띠 길이를 항상 동일하게 유지
       4. 너무 긴 제목은 글자 크기를 먼저 줄임
       5. 그래도 너무 길면 최대폭에서 2줄 허용
    ============================================================= */

    function fitTitleAndBars() {

        const MAX_WIDTH = 650;

        const BAR_PADDING = 20;

        let fontSize = 69;


        /* 처음에는 한 줄 */

        previewBookTitle.style.whiteSpace =
            'nowrap';


        previewBookTitle.style.width =
            MAX_WIDTH + 'px';


        previewBookTitle.style.fontSize =
            fontSize + 'px';


        /*
         * 제목이 650px 안에 들어올 때까지
         * 글자를 조금씩 줄인다.
         */

        while (
            previewBookTitle.scrollWidth > MAX_WIDTH &&
            fontSize > 40
        ) {

            fontSize -= 1;

            previewBookTitle.style.fontSize =
                fontSize + 'px';

        }


        /*
         * 그래도 너무 길면
         * 그때만 2줄 허용
         */

        if (
            previewBookTitle.scrollWidth > MAX_WIDTH
        ) {

            previewBookTitle.style.whiteSpace =
                'normal';

            previewBookTitle.style.width =
                MAX_WIDTH + 'px';

            previewBookTitle.style.overflow =
                'hidden';

            previewBookTitle.style.lineHeight =
                '1.15';

        }

        else {

            previewBookTitle.style.whiteSpace =
                'nowrap';

        }


        /*
         * 실제 제목이 차지하는 폭 측정
         */

        const titleWidth =
            Math.min(
                MAX_WIDTH,
                Math.max(
                    100,
                    previewBookTitle.scrollWidth
                )
            );


        /*
         * 제목 끝보다 약간 여유 있게
         * 색띠를 설정한다.
         */

        const barWidth =
            Math.min(
                MAX_WIDTH,
                titleWidth + BAR_PADDING
            );


        /*
         * 위/아래 색띠 동일 길이
         */

        topBar.style.width =
            barWidth + 'px';

        bottomBar.style.width =
            barWidth + 'px';


        /*
         * 영문 제목이 색띠 밖으로 나가지 않도록
         * 내부 최대폭도 함께 조정
         */

        previewEngTitle.style.maxWidth =
            Math.max(
                50,
                barWidth - 42
            ) + 'px';


        /*
         * 2줄 제목이 된 경우에도
         * 아래 색띠와의 간격이 이상하지 않도록
         * 약간 조정
         */

        if (
            previewBookTitle.style.whiteSpace ===
            'normal'
        ) {

            previewBookTitle.style.minHeight =
                '158px';

        }

        else {

            previewBookTitle.style.minHeight =
                'auto';

        }

    }



    /* =============================================================
       번호 변경
    ============================================================= */

    seriesNoInput.addEventListener(
        'input',
        function(e) {

            const value =
                formatSeriesNo(e.target.value);

            previewSeriesNo.textContent =
                value;

            previewSubSeriesNo.textContent =
                value;

        }
    );



    /* =============================================================
       책등 인물
    ============================================================= */

    authorImageSelect.addEventListener(
        'change',
        function(e) {

            portraitImg.src =
                e.target.value;

        }
    );



    /* =============================================================
       제목 변경
    ============================================================= */

    commonTitleInput.addEventListener(
        'input',
        function(e) {

            const value =
                e.target.value || '오만과 편견';


            previewBookTitle.textContent =
                value;


            previewSpineTitle.textContent =
                value;


            /*
             * 제목이 바뀔 때마다
             * 색띠 길이도 다시 계산
             */

            fitTitleAndBars();


            /*
             * 책등 저자의 위치도 제목에 맞춰
             * 다시 계산
             */

            fitSpineAuthor();

        }
    );



    /* =============================================================
       영문 제목
    ============================================================= */

    engTitleInput.addEventListener(
        'input',
        function(e) {

            previewEngTitle.textContent =
                e.target.value ||
                'Pride and Prejudice';

        }
    );



    /* =============================================================
       저자
    ============================================================= */

    authorInput.addEventListener(
        'input',
        function(e) {

            const value =
                e.target.value ||
                '제인 오스틴';


            previewAuthor.textContent =
                value;


            previewSpineAuthor.textContent =
                value;


            fitSpineAuthor();

        }
    );



    /* =============================================================
       역자
    ============================================================= */

    translatorInput.addEventListener(
        'input',
        function(e) {

            previewTranslator.textContent =
                e.target.value;

        }
    );



    /* =============================================================
       제작자
    ============================================================= */

    studentInfoInput.addEventListener(
        'input',
        function(e) {

            previewStudentInfo.textContent =
                e.target.value ||
                '3학년 5반 홍길동';

        }
    );



    /* =============================================================
       일러스트 업로드

       ★ 앞표지에만 들어감
    ============================================================= */

    imageInput.addEventListener(
        'change',
        function(e) {

            const file =
                e.target.files[0];

            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    previewImage.src =
                        event.target.result;

                    previewImage.style.display =
                        'block';

                    imagePlaceholder.style.display =
                        'none';

                };


            reader.readAsDataURL(file);

        }
    );



    /* =============================================================
       책등 저자 위치 자동 조정

       제목 밑에 작은 글씨가 오도록 함
    ============================================================= */

    function fitSpineAuthor() {

        /*
         * 책등 컬러 영역 안에서
         * 제목의 실제 높이를 측정
         */

        const titleHeight =
            previewSpineTitle.getBoundingClientRect().height /
            0.465;


        /*
         * 제목 시작 위치
         */

        const titleTop =
            48;


        /*
         * 제목 아래 여백
         */

        const gap =
            38;


        /*
         * 저자 시작 위치
         */

        let authorTop =
            titleTop +
            titleHeight +
            gap;


        /*
         * 너무 아래로 내려가면
         * 최대 위치 제한
         */

        authorTop =
            Math.min(
                authorTop,
                830
            );


        spineAuthorBox.style.top =
            authorTop + 'px';

    }



    /* =============================================================
       컬러 변경
    ============================================================= */

    colorChips.forEach(
        function(chip) {

            chip.addEventListener(
                'click',
                function() {


                    colorChips.forEach(
                        function(c) {

                            c.classList.remove(
                                'selected',
                                'ring-2',
                                'ring-indigo-600',
                                'ring-offset-2'
                            );

                        }
                    );


                    chip.classList.add(
                        'selected',
                        'ring-2',
                        'ring-indigo-600',
                        'ring-offset-2'
                    );


                    const color =
                        chip.dataset.color;


                    spineColorBox.style.backgroundColor =
                        color;

                    topBar.style.backgroundColor =
                        color;

                    bottomBar.style.backgroundColor =
                        color;

                }
            );

        }
    );



    /* =============================================================
       PNG 다운로드

       ★ 1080 × 1720
       ★ PNG
       ★ transparent
    ============================================================= */

    downloadBtn.addEventListener(
        'click',
        async function() {

            const info =
                studentInfoInput.value.trim() ||
                '학생';


            downloadBtn.disabled =
                true;


            downloadBtn.textContent =
                '✨ PNG 생성 중...';


            try {


                /*
                 * 캔버스 크기 확인
                 */

                captureArea.style.transform =
                    'none';


                /*
                 * 실제 출력 크기
                 */

                const canvas =
                    await html2canvas(
                        captureArea,
                        {

                            width:1080,

                            height:1720,

                            scale:1,

                            backgroundColor:null,

                            useCORS:true,

                            allowTaint:false,

                            imageTimeout:0

                        }
                    );


                /*
                 * 다시 미리보기 크기로 복구
                 */

                captureArea.style.transform =
                    'scale(0.465)';


                /*
                 * PNG 다운로드
                 */

                const link =
                    document.createElement('a');


                link.download =
                    `삼삼오오전집_${info}.png`;


                link.href =
                    canvas.toDataURL(
                        'image/png'
                    );


                link.click();


            }

            catch(error) {

                console.error(error);

                captureArea.style.transform =
                    'scale(0.465)';


                alert(
                    'PNG 생성 중 오류가 발생했습니다.\n\n' +
                    'minumsa.png와 작가 이미지 파일이 ' +
                    'index.html과 같은 폴더에 있는지 확인해주세요.'
                );

            }


            finally {

                downloadBtn.disabled =
                    false;

                downloadBtn.textContent =
                    '✨ 고화질 투명 PNG 다운로드';

            }

        }
    );



    /* =============================================================
       최초 실행
    ============================================================= */

    window.addEventListener(
        'load',
        function() {

            /*
             * 최초 제목/띠 크기 계산
             */

            fitTitleAndBars();


            /*
             * 최초 책등 저자 위치 계산
             */

            fitSpineAuthor();

        }
    );


</script>

</body>
</html>
