<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>봉산삼오전집 투명 책갈피 제작소</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .font-batang {
            font-family: 'Gowun Batang', serif;
        }

        .font-sans-kr {
            font-family: 'Noto Sans KR', sans-serif;
        }


        /* =========================================================
           실제 출력 규격
        ========================================================= */

        :root {
            --canvas-w: 1080px;
            --canvas-h: 1720px;

            --spine-w: 97px;
            --front-w: 983px;

            --image-h: 774px;
            --transparent-h: 946px;

            --main-color: #A61D4B;
        }


        /* =========================================================
           실제 디자인
        ========================================================= */

        .book-canvas {
            width: 1080px;
            height: 1720px;

            position: relative;

            display: flex;

            background: transparent;

            overflow: hidden;
        }


        /* =========================================================
           미리보기
        ========================================================= */

        .preview-frame {
            width: 502px;
            height: 800px;

            position: relative;

            overflow: hidden;

            flex-shrink: 0;

            background:
                repeating-conic-gradient(
                    #f1f5f9 0% 25%,
                    #ffffff 0% 50%
                )
                50% / 16px 16px;

            border-radius: 14px;
        }


        .preview-frame .book-canvas {
            transform: scale(0.465);
            transform-origin: top left;
        }


        /* =========================================================
           책등 세로 제목

           writing-mode를 사용하지 않는다.
           html2canvas에서도 깨지지 않도록
           글자 하나하나를 실제 세로로 배치한다.
        ========================================================= */

        .spine-title-columns {
            position: absolute;

            top: 35px;
            left: 0;

            width: 96px;
            height: 610px;

            display: flex;

            flex-direction: row-reverse;

            justify-content: center;

            align-items: flex-start;

            gap: 3px;

            overflow: hidden;
        }


        .spine-title-column {
            width: 43px;
            height: 570px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            /*
             * 글자 자체의 실제 폭이 43px보다 넓어도
             * 잘라내지 않는다.
             * 짧은 제목(64px)에서도 한자/한글의 좌우 획이
             * 잘리지 않도록 한다.
             */
            overflow: visible;

            flex-shrink: 0;
        }


        .spine-title-char {
            display: block;

            /*
             * 43px 박스 안에서 64px 글자를 중앙 정렬하되
             * 글자 자체는 절대 잘라내지 않는다.
             */
            width: 43px;

            height: 64px;

            overflow: visible;

            line-height: 64px;

            text-align: center;

            color: #ffffff;

            font-family: 'Gowun Batang', serif;

            font-size: 64px;

            font-weight: 700;

            letter-spacing: 0;

            flex-shrink: 0;
        }


        .minumsa-logo {
            display: block;

            object-fit: contain;

            object-position: center;

            flex-shrink: 0;
        }


        .color-chip {
            transition: transform 0.15s ease;
        }

        .color-chip.selected {
            transform: scale(1.1);
        }


        /* =========================================================
           앞표지 제목 영역
        ========================================================= */

        .front-title-area {
            width: 700px;

            height: 110px;

            margin-top: 28px;

            margin-bottom: 29px;

            display: flex;

            align-items: center;

            overflow: hidden;
        }


        #previewBookTitle {
            width: 700px;

            margin: 0;

            padding: 0;

            font-family: 'Gowun Batang', serif;

            font-size: 83px;

            line-height: 1;

            font-weight: 700;

            letter-spacing: -0.055em;

            color: #111111;

            word-break: keep-all;

            white-space: nowrap;

            overflow: hidden;

            text-align: left;
        }

    </style>
</head>


<body class="bg-slate-100 min-h-screen p-4 md:p-8">


<div
    class="max-w-[1400px] mx-auto bg-white rounded-2xl shadow-xl overflow-hidden
           grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_560px]"
>


    <!-- =============================================================
         설정
    ============================================================== -->

    <div
        class="p-6 md:p-8 flex flex-col justify-between
               border-b lg:border-b-0 lg:border-r border-slate-200"
    >

        <div class="space-y-4">


            <h1 class="text-2xl font-bold text-slate-800">
                📚 봉산삼오전집 투명 책갈피
            </h1>


            <p class="text-xs text-slate-500">
                스냅스 포토카드 54:86 · 1080×1720px · 투명 PNG
            </p>


            <!-- =====================================================
                 이미지
            ====================================================== -->

            <div>

                <label class="block text-sm font-semibold text-slate-700 mb-1">
                    상단 일러스트 이미지
                </label>


                <input
                    type="file"
                    id="imageInput"
                    accept="image/*,.avif"
                    class="w-full text-sm text-slate-500
                           file:mr-4 file:py-2 file:px-4
                           file:rounded-full file:border-0
                           file:text-sm file:font-semibold
                           file:bg-indigo-50 file:text-indigo-700
                           hover:file:bg-indigo-100 cursor-pointer"
                >


                <p class="text-[11px] text-slate-400 mt-1">
                    ※ JPG · PNG · WEBP · AVIF 지원
                    · 앞표지 상단 45% 영역
                </p>

            </div>



            <!-- =====================================================
                 번호 / 인물
            ====================================================== -->

            <div class="grid grid-cols-2 gap-3">


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        전집 번호
                    </label>


                    <input
                        type="number"
                        id="seriesNoInput"
                        value="88"
                        min="1"
                        max="999"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>



                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        책등 인물
                    </label>


                    <select
                        id="authorImageSelect"
                        class="w-full px-3 py-2 border rounded-lg
                               outline-none bg-white text-sm"
                    >

                        <option value="Jane.png">
                            제인 오스틴
                        </option>

                        <option value="Hankang.png">
                            한강 작가
                        </option>

                        <option value="Sejong.png">
                            세종대왕
                        </option>

                        <option value="Shakespeare.png">
                            셰익스피어
                        </option>

                        <option value="Hwang.png">
                            황석영 작가
                        </option>

                    </select>

                </div>

            </div>



            <!-- =====================================================
                 제목
            ====================================================== -->

            <div class="grid grid-cols-2 gap-3">


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        책 제목
                    </label>


                    <input
                        type="text"
                        id="commonTitleInput"
                        value="오만과 편견"
                        maxlength="40"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>



                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        영문 원제
                    </label>


                    <input
                        type="text"
                        id="engTitleInput"
                        value="Pride and Prejudice"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>

            </div>



            <!-- =====================================================
                 저자 / 역자
            ====================================================== -->

            <div class="grid grid-cols-2 gap-3">


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        저자명
                    </label>


                    <input
                        type="text"
                        id="authorInput"
                        value="제인 오스틴"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>



                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        역자명
                    </label>


                    <input
                        type="text"
                        id="translatorInput"
                        value="윤지관, 전승희 옮김"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>

            </div>



            <!-- =====================================================
                 색상
            ====================================================== -->

            <div>

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    책등 & 띠 컬러
                </label>


                <div class="flex flex-wrap gap-2.5">


                    <button
                        type="button"
                        class="color-chip selected w-8 h-8 rounded-full
                               border-2 border-white shadow-md
                               ring-2 ring-indigo-600 ring-offset-2"
                        style="background:#A61D4B"
                        data-color="#A61D4B"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#1E3A8A"
                        data-color="#1E3A8A"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#065F46"
                        data-color="#065F46"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#581C87"
                        data-color="#581C87"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#B45309"
                        data-color="#B45309"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#111827"
                        data-color="#111827"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#0369A1"
                        data-color="#0369A1"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#9A3412"
                        data-color="#9A3412"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#4D7C0F"
                        data-color="#4D7C0F"
                    ></button>


                </div>

            </div>

        </div>



        <button
            id="downloadBtn"
            class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700
                   text-white font-semibold py-3 rounded-xl
                   transition shadow-md"
        >
            ✨ 고화질 투명 PNG 다운로드
        </button>

    </div>



    <!-- =============================================================
         미리보기
    ============================================================== -->

    <div
        class="p-6 md:p-8 bg-slate-50 flex flex-col
               items-center justify-start overflow-auto"
    >


        <p class="text-xs font-medium text-slate-400 mb-3">
            실시간 미리보기 · 54:86 · 사진 45%
        </p>


        <div
            id="previewFrame"
            class="preview-frame"
        >


            <div
                id="captureArea"
                class="book-canvas"
            >


                <!-- =================================================
                     책등
                ================================================== -->

                <div
                    id="spine"
                    style="
                        width:97px;
                        height:1720px;
                        position:relative;
                        flex-shrink:0;
                        background:transparent;
                    "
                >


                    <!-- 책등 상단 -->

                    <div
                        style="
                            position:absolute;
                            top:0;
                            left:0;
                            width:96px;
                            height:260px;
                            background:transparent;
                            display:flex;
                            flex-direction:column;
                            justify-content:flex-end;
                            align-items:flex-end;
                            padding-right:4px;
                            padding-bottom:8px;
                            overflow:visible;
                        "
                    >


                        <!-- 번호 -->

                        <div
                            class="font-sans-kr"
                            style="
                                width:100%;
                                text-align:right;
                                font-size:51px;
                                line-height:1;
                                font-weight:700;
                                color:#111111;
                                white-space:nowrap;
                            "
                        >

                            <span id="previewSeriesNo">
                                088
                            </span>

                        </div>



                        <!-- 봉산삼오전집 -->

                        <div
                            class="font-sans-kr"
                            style="
                                width:100%;
                                text-align:right;
                                font-size:34px;
                                line-height:1.15;
                                font-weight:700;
                                color:#111111;
                                white-space:nowrap;
                            "
                        >

                            <span>봉산</span><br>
                            <span>삼오</span><br>
                            <span>전집</span>

                        </div>

                    </div>



                    <!-- =================================================
                         작가 사진

                         원본 비율 유지.
                         영역보다 큰 부분만 crop.
                    ================================================== -->

                    <div
                        style="
                            position:absolute;
                            top:260px;
                            left:0;
                            width:96px;
                            height:150px;
                            overflow:hidden;
                            background:#e5e7eb;
                        "
                    >

                        <img
                            id="portraitImg"
                            src="Jane.png"
                            alt="작가 초상"
                            style="
                                display:block;
                                width:100%;
                                height:100%;
                                object-fit:cover;
                                object-position:center center;
                                filter:grayscale(100%) contrast(115%);
                            "
                        >

                    </div>



                    <!-- 책등 컬러 -->

                    <div
                        id="spineColorBox"
                        style="
                            position:absolute;
                            top:410px;
                            left:0;
                            width:96px;
                            height:1050px;
                            background:#A61D4B;
                            overflow:hidden;
                        "
                    >


                        <!-- =================================================
                             책등 제목

                             실제 글자 하나하나를 세로로 배치
                             writing-mode 사용 안 함
                        ================================================== -->

                        <div
                            id="spineTitleColumns"
                            class="spine-title-columns"
                        >

                            <!-- 오른쪽 열 -->

                            <div
                                id="spineTitleColumn1"
                                class="spine-title-column"
                            ></div>


                            <!-- 왼쪽 열 -->

                            <div
                                id="spineTitleColumn2"
                                class="spine-title-column"
                            ></div>

                        </div>



                        <!-- =================================================
                             책등 저자

                             제목과 완전히 독립
                        ================================================== -->

                        <div
                            id="spineAuthorBox"
                            style="
                                position:absolute;
                                top:700px;
                                left:0;
                                width:96px;
                                height:300px;
                                display:flex;
                                justify-content:center;
                                align-items:flex-start;
                                overflow:hidden;
                            "
                        >

                            <span
                                id="previewSpineAuthor"
                                class="font-sans-kr"
                                style="
                                    color:#ffffff;
                                    font-size:34px;
                                    font-weight:500;
                                    line-height:1;
                                    letter-spacing:0;
                                    white-space:nowrap;
                                    writing-mode:vertical-rl;
                                    text-orientation:upright;
                                "
                            >
                                제인 오스틴
                            </span>

                        </div>

                    </div>



                    <!-- 책등 하단 -->

                    <div
                        style="
                            position:absolute;
                            left:0;
                            bottom:0;
                            width:96px;
                            height:260px;
                            background:transparent;
                            display:flex;
                            align-items:flex-end;
                            justify-content:center;
                            padding-bottom:58px;
                        "
                    >

                        <img
                            src="./minumsa.png"
                            alt="민음사"
                            class="minumsa-logo"
                            style="
                                width:84px;
                                height:48px;
                            "
                        >

                    </div>

                </div>



                <!-- =================================================
                     앞표지
                ================================================== -->

                <div
                    id="frontCover"
                    style="
                        width:983px;
                        height:1720px;
                        position:relative;
                        flex-shrink:0;
                        background:transparent;
                    "
                >


                    <!-- =================================================
                         앞표지 이미지

                         원본 비율 유지.
                         틀보다 큰 부분은 crop.
                         절대로 찌그러뜨리지 않는다.
                    ================================================== -->

                    <div
                        style="
                            position:absolute;
                            top:0;
                            left:0;
                            width:983px;
                            height:774px;
                            overflow:hidden;
                            background:transparent;
                        "
                    >

                        <img
                            id="previewImage"
                            src=""
                            alt=""
                            style="
                                display:none;
                                width:100%;
                                height:100%;
                                object-fit:cover;
                                object-position:center center;
                            "
                        >


                        <div
                            id="imagePlaceholder"
                            class="font-sans-kr"
                            style="
                                position:absolute;
                                inset:0;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                background:#f8fafc;
                                color:#94a3b8;
                                font-size:20px;
                            "
                        >
                            앞표지 일러스트 · 45%
                        </div>

                    </div>



                    <!-- 앞표지 하단 -->

                    <div
                        style="
                            position:absolute;
                            top:774px;
                            left:0;
                            width:983px;
                            height:946px;
                            background:transparent;
                        "
                    >


                        <!-- 앞표지 텍스트 -->

                        <div
                            style="
                                position:absolute;
                                left:59px;
                                top:42px;
                                width:900px;
                            "
                        >


                            <!-- 전집명 + 번호 -->

                            <div
                                class="font-sans-kr"
                                style="
                                    margin-left:17px;
                                    font-size:50px;
                                    line-height:1;
                                    font-weight:700;
                                    color:#111111;
                                    white-space:nowrap;
                                    display:flex;
                                    align-items:baseline;
                                    justify-content:flex-start;
                                    text-align:left;
                                "
                            >

                                <span id="previewSubSeriesName">
                                    봉산삼오전집
                                </span>

                                <span
                                    id="previewSubSeriesNo"
                                    style="
                                        margin-left:20px;
                                    "
                                >
                                    088
                                </span>

                            </div>



                            <!-- 위 색띠 -->

                            <div
                                id="topBar"
                                style="
                                    width:700px;
                                    height:55px;
                                    margin-top:28px;
                                    background:#A61D4B;
                                "
                            ></div>



                            <!-- =================================================
                                 책 제목

                                 고정 110px 영역.
                                 제목을 이 영역의 정중앙에 배치.
                            ================================================== -->

                            <div
                                class="front-title-area"
                                id="frontTitleArea"
                            >

                                <div
                                    id="previewBookTitle"
                                >
                                    오만과 편견
                                </div>

                            </div>



                            <!-- 아래 색띠 -->

                            <div
                                id="bottomBar"
                                style="
                                    width:700px;
                                    height:55px;
                                    display:flex;
                                    align-items:center;
                                    padding-left:21px;
                                    background:#A61D4B;
                                "
                            >

                                <span
                                    id="previewEngTitle"
                                    class="font-sans-kr"
                                    style="
                                        color:#ffffff;
                                        font-size:32.3px;
                                        font-weight:500;
                                        white-space:nowrap;
                                        overflow:hidden;
                                        text-overflow:ellipsis;
                                        max-width:658px;
                                    "
                                >
                                    Pride and Prejudice
                                </span>

                            </div>



                            <!-- 저자 / 역자 -->

                            <div
                                class="font-sans-kr"
                                style="
                                    display:flex;
                                    align-items:baseline;
                                    margin-top:29px;
                                    margin-left:17px;
                                "
                            >

                                <span
                                    id="previewAuthor"
                                    style="
                                        font-size:54px;
                                        font-weight:700;
                                        color:#111111;
                                        white-space:nowrap;
                                    "
                                >
                                    제인 오스틴
                                </span>


                                <span
                                    id="previewTranslator"
                                    style="
                                        font-size:45px;
                                        font-weight:400;
                                        color:#111111;
                                        margin-left:17px;
                                        white-space:nowrap;
                                    "
                                >
                                    윤지관, 전승희 옮김
                                </span>

                            </div>

                        </div>



                        <!-- 앞표지 민음사 -->

                        <div
                            style="
                                position:absolute;
                                left:59px;
                                bottom:61px;
                                display:flex;
                                align-items:center;
                            "
                        >

                            <img
                                src="./minumsa.png"
                                alt="민음사"
                                class="minumsa-logo"
                                style="
                                    width:152px;
                                    height:84px;
                                "
                            >

                        </div>


                    </div>

                </div>



                <!-- =================================================
                     경계선

                     딱 하나의 1px 검은 선
                ================================================== -->

                <div
                    id="spineDivider"
                    aria-hidden="true"
                    style="
                        position:absolute;
                        top:0;
                        left:96px;
                        width:1px;

    function formatSeriesNo(value) {

        const cleaned =
            String(value ?? '')
                .replace(/\D/g, '');

        if (!cleaned) {
            return '001';
        }

        const number =
            parseInt(cleaned, 10);

        if (
            isNaN(number) ||
            number <= 0
        ) {
            return '001';
        }

        return String(
            Math.min(number, 999)
        ).padStart(3, '0');
    }

    /* =============================================================

       제목 영역은 700×110으로 고정.

    ============================================================= */

    function fitTitleAndBars() {

        const MAX_WIDTH =
            700;

        const NORMAL_FONT_SIZE =
            91.3;

        const MIN_FONT_SIZE =
            42;


        let fontSize =
            NORMAL_FONT_SIZE;


        previewBookTitle.style.fontSize =
            fontSize + 'px';

        previewBookTitle.style.whiteSpace =
            'nowrap';

        previewBookTitle.style.display =
            'block';

        previewBookTitle.style.lineHeight =
            '1';

        previewBookTitle.style.height =
            'auto';

        previewBookTitle.style.overflow =
            'hidden';


        /* ---------------------------------------------------------
           우선 한 줄에서 최대한 크게
        --------------------------------------------------------- */

        while (
            previewBookTitle.scrollWidth >
                MAX_WIDTH &&
            fontSize >
                MIN_FONT_SIZE
        ) {

            fontSize -= 1;

            previewBookTitle.style.fontSize =
                fontSize + 'px';
        }


        /* ---------------------------------------------------------
           그래도 안 들어가면 2줄
        --------------------------------------------------------- */

        if (
            previewBookTitle.scrollWidth >
            MAX_WIDTH
        ) {

            previewBookTitle.style.whiteSpace =
                'normal';

            previewBookTitle.style.display =
                '-webkit-box';

            previewBookTitle.style.webkitBoxOrient =
                'vertical';

            previewBookTitle.style.webkitLineClamp =
                '2';

            previewBookTitle.style.lineHeight =
                '0.9';

            previewBookTitle.style.height =
                '100%';

            previewBookTitle.style.overflow =
                'hidden';

        } else {

            previewBookTitle.style.whiteSpace =
                'nowrap';

            previewBookTitle.style.display =
                'block';

            previewBookTitle.style.webkitLineClamp =
                'unset';

            previewBookTitle.style.lineHeight =
                '1';

            previewBookTitle.style.height =
                'auto';
        }


        /* ---------------------------------------------------------
           색띠 길이
        --------------------------------------------------------- */

        const titleWidth =
            Math.min(
                MAX_WIDTH,
                Math.max(
                    100,
                    previewBookTitle.scrollWidth
                )
            );


        const finalBarWidth =
            Math.min(
                900,
                Math.max(
                    700,
                    titleWidth
                )
            );


        topBar.style.width =
            finalBarWidth + 'px';

        bottomBar.style.width =
            finalBarWidth + 'px';


        previewEngTitle.style.maxWidth =
            Math.max(
                50,
                finalBarWidth - 42
            ) + 'px';

    }



    /* =============================================================
       책등 제목 글자 생성
    ============================================================= */

    function makeSpineCharacters(
        container,
        text,
        fontSize
    ) {

        container.innerHTML =
            '';


        const chars =
            Array.from(
                text
            );


        chars.forEach(
            function(char) {

                const span =
                    document.createElement(
                        'span'
                    );


                span.className =
                    'spine-title-char';


                span.textContent =
                    char === ' '
                        ? '\u00A0'
                        : char;


                span.style.fontSize =
                    fontSize + 'px';


                span.style.height =
                    fontSize + 'px';


                span.style.lineHeight =
                    fontSize + 'px';


                container.appendChild(
                    span
                );

            }
        );

    }



    /* =============================================================
       책등 제목

       ★ writing-mode를 사용하지 않음 ★

       1열:
       글자 하나
       글자 하나
       글자 하나
       ...

       긴 제목:
       오른쪽 열
       글자
       글자
       글자

       왼쪽 열
       글자
       글자
       글자
    ============================================================= */

    function fitSpineTitle() {

        const title =
            commonTitleInput.value ||
            '오만과 편견';


        const MAX_ONE_COLUMN_HEIGHT =
            570;

        const MAX_TWO_COLUMN_HEIGHT =
            570;

        const MAX_FONT =
            64;

        const MIN_FONT =
            24;


        /* ---------------------------------------------------------
           우선 1열 64px
        --------------------------------------------------------- */

        let fontSize =
            MAX_FONT;


        let charCount =
            Array.from(title).length;


        /*
         * 글자 하나의 높이는 fontSize와 동일하게 사용한다.
         */

        let oneColumnHeight =
            charCount * fontSize;


        while (
            oneColumnHeight >
                MAX_ONE_COLUMN_HEIGHT &&
            fontSize >
                MIN_FONT
        ) {

            fontSize -= 1;

            oneColumnHeight =
                charCount * fontSize;
        }


        /* ---------------------------------------------------------
           1열로 들어가는 경우
        --------------------------------------------------------- */

        if (
            oneColumnHeight <=
            MAX_ONE_COLUMN_HEIGHT
        ) {

            makeSpineCharacters(
                spineTitleColumn1,
                title,
                fontSize
            );


            spineTitleColumn2.innerHTML =
                '';


            spineTitleColumn2.style.display =
                'none';


            spineTitleColumn1.style.display =
                'flex';


            spineTitleColumn1.style.width =
                '43px';


            spineTitleColumns.style.flexDirection =
                'row';


            return;
        }



        /* =========================================================
           긴 제목 → 2열
        ========================================================= */


        spineTitleColumn1.style.display =
            'flex';

        spineTitleColumn2.style.display =
            'flex';


        spineTitleColumns.style.flexDirection =
            'row-reverse';


        /*
         * 2열에서는 최대한 큰 글자를 사용하되
         * 각 열이 570px 안에 들어가도록 한다.
         */

        let twoFont =
            64;


        const chars =
            Array.from(title);


        /*
         * 먼저 균등하게 나눈다.
         */

        let splitIndex =
            Math.ceil(
                chars.length / 2
            );


        let firstChars =
            chars.slice(
                0,
                splitIndex
            );

        let secondChars =
            chars.slice(
                splitIndex
            );


        /*
         * 두 열 중 긴 쪽의 글자 수를 기준으로
         * 폰트 크기를 결정한다.
         */

        let longestCount =
            Math.max(
                firstChars.length,
                secondChars.length
            );


        while (
            longestCount * twoFont >
                MAX_TWO_COLUMN_HEIGHT &&
            twoFont >
                MIN_FONT
        ) {

            twoFont -= 1;
        }


        /* ---------------------------------------------------------
           실제 생성
        --------------------------------------------------------- */

        makeSpineCharacters(
            spineTitleColumn1,
            firstChars.join(''),
            twoFont
        );


        makeSpineCharacters(
            spineTitleColumn2,
            secondChars.join(''),
            twoFont
        );


        spineTitleColumn1.style.width =
            '43px';

        spineTitleColumn2.style.width =
            '43px';


        spineTitleColumn1.style.height =
            MAX_TWO_COLUMN_HEIGHT + 'px';

        spineTitleColumn2.style.height =
            MAX_TWO_COLUMN_HEIGHT + 'px';

    }

    /* =============================================================

    function waitForImages(container) {

            container.querySelectorAll('img');
