<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼삼오오전집 투명 책갈피 제작소</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
        .font-batang { font-family: 'Gowun Batang', serif; }
        .font-sans-kr { font-family: 'Noto Sans KR', sans-serif; }

        :root {
            --canvas-w: 1192px;
            --canvas-h: 2048px;
        }
        .book-canvas {
            width: var(--canvas-w);
            height: var(--canvas-h);
            transform: scale(0.22);
            transform-origin: top left;
            margin-bottom: -1597px;
            margin-right: -930px;
        }
        .color-chip {
            transition: all 0.2s ease;
        }
        .color-chip.ring-offset-2 {
            transform: scale(1.1);
        }
        /* 책등 세로쓰기 절대 꺾임 방지 및 강제 한 줄 고정 */
        .spine-text-single {
            writing-mode: vertical-rl;
            text-orientation: upright;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
        
        <!-- 입력 폼 영역 -->
        <div class="p-6 md:p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-200">
            <div class="space-y-4">
                <h1 class="text-2xl font-bold text-slate-800">📚 삼삼오오전집 투명 책갈피</h1>
                <p class="text-xs text-slate-500">사진부 30% / 투명부 70% 및 민음사 출판사명 완벽 복구 완료</p>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">제작자 정보 (예: 3학년 5반 김민수)</label>
                    <input type="text" id="studentInfoInput" placeholder="3학년 5반 홍길동" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">상단 일러스트 이미지 (표지 30% 영역)</label>
                    <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">전집 번호 (숫자 입력)</label>
                        <input type="number" id="seriesNoInput" value="1" min="1" max="999" class="w-full px-3 py-2 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">책등 인물 선택</label>
                        <select id="authorImageSelect" class="w-full px-3 py-2 border rounded-lg outline-none bg-white text-sm">
                            <option value="Hankang.png">한강 작가</option>
                            <option value="Sejong.png">세종대왕</option>
                            <option value="Shakespeare.png">셰익스피어</option>
                            <option value="Jane.png">제인 오스틴</option>
                            <option value="Hwang.png">황석영 작가</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">책 제목 (한글)</label>
                        <input type="text" id="commonTitleInput" maxlength="25" value="여기는 어디 나는 누구?" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">영문 원제 (띠 표기용)</label>
                        <input type="text" id="engTitleInput" value="Where am I, Who am I?" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">저자명</label>
                        <input type="text" id="authorInput" value="제인 오스틴" class="w-full px-3 py-2 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">역자명 (옵션)</label>
                        <input type="text" id="translatorInput" value="윤지관, 전승희 옮김" class="w-full px-3 py-2 border rounded-lg outline-none">
                    </div>
                </div>

                <!-- 컬러 칩 팔레트 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">전집 책등 & 띠 컬러 선택</label>
                    <div class="flex flex-wrap gap-2.5 items-center">
                        <button type="button" class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md ring-2 ring-indigo-600 ring-offset-2" style="background-color: #A61D4B;" data-color="#A61D4B" title="클래식 레드"></button>
                        <button type="button" class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md ring-1 ring-slate-300" style="background-color: #1E3A8A;" data-color="#1E3A8A" title="다크 네이비"></button>
                        <button type="button" class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md ring-1 ring-slate-300" style="background-color: #065F46;" data-color="#065F46" title="포레스트 그린"></button>
                        <button type="button" class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md ring-1 ring-slate-300" style="background-color: #581C87;" data-color="#581C87" title="로얄 퍼플"></button>
                        <button type="button" class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md ring-1 ring-slate-300" style="background-color: #B45309;" data-color="#B45309" title="앰버 브라운"></button>
                        <button type="button" class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md ring-1 ring-slate-300" style="background-color: #111827;" data-color="#111827" title="차콜 블랙"></button>
                        <button type="button" class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md ring-1 ring-slate-300" style="background-color: #0369A1;" data-color="#0369A1" title="스카이 블루"></button>
                        <button type="button" class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md ring-1 ring-slate-300" style="background-color: #9A3412;" data-color="#9A3412" title="테라코타 오렌지"></button>
                        <button type="button" class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md ring-1 ring-slate-300" style="background-color: #4D7C0F;" data-color="#4D7C0F" title="올리브 그린"></button>
                    </div>
                </div>
            </div>

            <button id="downloadBtn" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-md">
                ✨ 고화질 투명 PNG 다운로드
            </button>
        </div>

        <!-- 미리보기 영역 -->
        <div class="p-6 md:p-8 bg-slate-50 flex flex-col items-center justify-center overflow-hidden">
            <p class="text-xs font-medium text-slate-400 mb-3">실시간 미리보기 (사진 30% : 투명부 70% 및 민음사 명칭 포함)</p>
            
            <div class="w-[220px] h-[377px] bg-white rounded-2xl shadow-lg border border-slate-200 relative overflow-hidden flex">
                
                <!-- 1192 x 2048 전체 캔버스 -->
                <div id="captureArea" class="book-canvas bg-white relative flex font-batang select-none">
                    
                    <!-- [1] 왼쪽 독립 책등 영역 (두께 70% = 112px) -->
                    <div class="w-[112px] h-full bg-white border-r-[3px] border-slate-300 flex flex-col justify-between items-center relative">
                        
                        <!-- 상단 전집 번호 & 작가 사진 -->
                        <div class="w-full flex flex-col items-center pt-[220px]">
                            <div class="flex items-center gap-1 text-[22px] font-sans-kr font-bold text-slate-800 tracking-tight mb-2">
                                <span id="previewSeriesNo">001</span>
                            </div>
                            <div class="w-[112px] h-[112px] bg-slate-200 grayscale contrast-125 border-y border-slate-400 relative flex items-center justify-center overflow-hidden">
                                <img src="Hankang.png" class="w-full h-full object-cover" id="portraitImg" alt="작가 초상화" onerror="this.style.display='none'; document.getElementById('imgFallback').style.display='flex';">
                                <div id="imgFallback" style="display:none; position:absolute; inset:0; font-size:9px; text-align:center; padding:2px; color:#555; background:#e2e8f0; align-items:center; justify-content:center; word-break:keep-all; font-family:'Noto Sans KR', sans-serif;">Hankang.png 필요</div>
                            </div>
                        </div>

                        <!-- 중앙~하단 컬러부 (강제 한 줄 세로쓰기 적용) -->
                        <div id="spineColorBox" class="absolute left-0 right-0 bottom-[220px] top-[382px] flex items-center justify-around px-1 transition-colors duration-300 overflow-hidden" style="background-color: #A61D4B;">
                            <span id="previewSpineAuthor" class="spine-text-single text-[15px] font-sans-kr font-medium text-white tracking-widest">제인 오스틴</span>
                            <span id="previewSpineTitle" class="spine-text-single text-[24px] font-batang font-bold text-white uppercase tracking-widest">여기는 어디 나는 누구?</span>
                        </div>

                        <!-- 최하단 책등 민음사 출판사명 및 로고 -->
                        <div class="w-[70px] h-[160px] flex flex-col items-center justify-center z-10 pb-2">
                            <span class="font-sans-kr font-bold text-[13px] text-slate-800 tracking-wider mb-2">민음사</span>
                            <img src="minumsa.png" alt="민음사 로고" class="w-full object-contain" onerror="this.style.display='none';">
                        </div>
                    </div>

                    <!-- [2] 오른쪽 메인 표지 영역 -->
                    <div class="flex-1 flex flex-col h-full bg-white relative">
                        
                        <!-- 상단 사진 영역: 정확히 30% (614.4px ≒ 614px) -->
                        <div class="w-full h-[614px] bg-slate-100 relative overflow-hidden flex items-center justify-center border-b-[3px] border-slate-300">
                            <img id="previewImage" src="" alt="" class="w-full h-full object-cover hidden">
                            <span id="imagePlaceholder" class="text-xl text-slate-400 font-sans-kr text-center px-4">상단 사진 영역 (30% · 614px)</span>
                        </div>

                        <!-- 하단 투명부 영역: 정확히 70% (1433.6px ≒ 1434px) -->
                        <div class="flex-1 w-full relative flex flex-col justify-start" style="height: 1434px; padding-left: 71px; padding-top: 45px;">
                            
                            <div class="text-[26px] font-sans-kr font-bold text-slate-900 tracking-tight" style="margin-left: 21px;">
                                삼삼오오전집 <span id="previewSubSeriesNo">001</span>
                            </div>

                            <div id="topBar" class="w-[608px] h-[67px] mt-[16px] transition-colors duration-300" style="background-color: #A61D4B;"></div>

                            <div id="previewBookTitle" class="font-bold text-slate-900 tracking-wide" style="font-size: 72px; line-height: 1.2; margin-top: 35px; margin-bottom: 35px; word-break: keep-all; overflow-wrap: break-word; max-width: 630px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">여기는 어디 나는 누구?</div>

                            <div id="bottomBar" class="w-[608px] h-[67px] flex items-center transition-colors duration-300" style="background-color: #A61D4B; padding-left: 25px;">
                                <span id="previewEngTitle" class="text-white font-sans-kr font-medium tracking-wide truncate" style="font-size: 23px; max-width: 560px;">Where am I, Who am I?</span>
                            </div>

                            <div class="flex items-baseline font-sans-kr" style="margin-top: 35px;">
                                <span id="previewAuthor" class="font-bold text-slate-900" style="font-size: 30px;">제인 오스틴</span>
                                <span id="previewTranslator" class="text-slate-600 font-normal" style="font-size: 20px; margin-left: 15px;">윤지관, 전승희 옮김</span>
                            </div>

                            <div class="font-sans-kr text-slate-500 font-medium" style="margin-top: 15px; font-size: 22px;">
                                <span id="previewStudentInfo">3학년 5반 홍길동</span>
                            </div>

                            <!-- 표지 하단 민음사 출판사명 및 로고 -->
                            <div style="position: absolute; bottom: 80px; left: 71px; display: flex; align-items: center; gap: 16px;">
                                <span class="font-sans-kr font-bold text-[28px] text-slate-900 tracking-tight">민음사</span>
                                <img src="minumsa.png" alt="민음사 로고" style="width: 120px; object-fit: contain;" onerror="this.style.display='none';">
                            </div>

                        </div>

                    </div>

                </div>

            </div>
            <p class="text-[11px] text-slate-400 mt-4 text-center">※ 사진부 30% / 투명부 70% 및 민음사 출판사명 정상 출력 완료</p>
        </div>

    </div>

    <!-- 스크립트 로직 -->
    <script>
        const studentInfoInput = document.getElementById('studentInfoInput');
        const seriesNoInput = document.getElementById('seriesNoInput');
        const commonTitleInput = document.getElementById('commonTitleInput');
        const engTitleInput = document.getElementById('engTitleInput');
        const authorInput = document.getElementById('authorInput');
        const translatorInput = document.getElementById('translatorInput');
        const imageInput = document.getElementById('imageInput');
        const authorImageSelect = document.getElementById('authorImageSelect');

        const previewSeriesNo = document.getElementById('previewSeriesNo');
        const previewSubSeriesNo = document.getElementById('previewSubSeriesNo');
        const previewSpineTitle = document.getElementById('previewSpineTitle');
        const previewSpineAuthor = document.getElementById('previewSpineAuthor');
        const previewBookTitle = document.getElementById('previewBookTitle');
        const previewEngTitle = document.getElementById('previewEngTitle');
        const previewAuthor = document.getElementById('previewAuthor');
        const previewTranslator = document.getElementById('previewTranslator');
        const previewStudentInfo = document.getElementById('previewStudentInfo');
        const previewImage = document.getElementById('previewImage');
        const imagePlaceholder = document.getElementById('imagePlaceholder');
        const portraitImg = document.getElementById('portraitImg');
        const imgFallback = document.getElementById('imgFallback');

        const spineColorBox = document.getElementById('spineColorBox');
        const topBar = document.getElementById('topBar');
        const bottomBar = document.getElementById('bottomBar');
        const colorChips = document.querySelectorAll('.color-chip');
        
        const downloadBtn = document.getElementById('downloadBtn');
        const captureArea = document.getElementById('captureArea');

        function formatSeriesNo(val) {
            const num = parseInt(val, 10);
            if (isNaN(num) || num <= 0) return '001';
            return String(num).padStart(3, '0');
        }

        seriesNoInput.addEventListener('input', (e) => {
            const formatted = formatSeriesNo(e.target.value);
            previewSeriesNo.innerText = formatted;
            previewSubSeriesNo.innerText = formatted;
        });

        authorImageSelect.addEventListener('change', (e) => {
            portraitImg.src = e.target.value;
            portraitImg.style.display = 'block';
            if(imgFallback) imgFallback.style.display = 'none';
        });

        commonTitleInput.addEventListener('input', (e) => {
            const val = e.target.value || '여기는 어디 나는 누구?';
            previewBookTitle.innerText = val;
            previewSpineTitle.innerText = val;
        });

        engTitleInput.addEventListener('input', (e) => {
            previewEngTitle.innerText = e.target.value || 'Where am I, Who am I?';
        });

        authorInput.addEventListener('input', (e) => {
            const val = e.target.value || '제인 오스틴';
            previewAuthor.innerText = val;
            previewSpineAuthor.innerText = val;
        });

        translatorInput.addEventListener('input', (e) => {
            previewTranslator.innerText = e.target.value;
        });

        studentInfoInput.addEventListener('input', (e) => {
            previewStudentInfo.innerText = e.target.value || '3학년 5반 홍길동';
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImage.src = event.target.result;
                    previewImage.classList.remove('hidden');
                    imagePlaceholder.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        colorChips.forEach(chip => {
            chip.addEventListener('click', (e) => {
                colorChips.forEach(c => c.classList.remove('ring-2', 'ring-indigo-600', 'ring-offset-2'));
                chip.classList.add('ring-2', 'ring-indigo-600', 'ring-offset-2');

                const colorCode = chip.getAttribute('data-color');
                spineColorBox.style.backgroundColor = colorCode;
                topBar.style.backgroundColor = colorCode;
                bottomBar.style.backgroundColor = colorCode;
            });
        });

        downloadBtn.addEventListener('click', async () => {
            const info = studentInfoInput.value.trim() || '학생';
            downloadBtn.innerText = '✨ 고화질 1192px 변환 중...';
            downloadBtn.disabled = true;

            try {
                const canvas = await html2canvas(captureArea, {
                    scale: 1,
                    backgroundColor: null,
                    useCORS: true
                });

                const link = document.createElement('a');
                link.download = `삼삼오오전집_${info}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (error) {
                alert('다운로드 중 오류가 발생했습니다.');
            } finally {
                downloadBtn.innerText = '✨ 고화질 투명 PNG 다운로드';
                downloadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
