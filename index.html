<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>봉산삼오전집 투명 책갈피 제작소</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .font-batang {
            font-family: 'Gowun Batang', serif;
        }

        .font-sans-kr {
            font-family: 'Noto Sans KR', sans-serif;
        }


        /* =========================================================
           실제 출력 규격
        ========================================================= */

        :root {
            --canvas-w: 1080px;
            --canvas-h: 1720px;

            --spine-w: 97px;
            --front-w: 983px;

            --image-h: 774px;
            --transparent-h: 946px;

            --main-color: #A61D4B;
        }


        /* =========================================================
           실제 디자인
        ========================================================= */

        .book-canvas {
            width: 1080px;
            height: 1720px;

            position: relative;

            display: flex;

            background: transparent;

            overflow: hidden;
        }


        /* =========================================================
           미리보기
        ========================================================= */

        .preview-frame {
            width: 502px;
            height: 800px;

            position: relative;

            overflow: hidden;

            flex-shrink: 0;

            background:
                repeating-conic-gradient(
                    #f1f5f9 0% 25%,
                    #ffffff 0% 50%
                )
                50% / 16px 16px;

            border-radius: 14px;
        }


        .preview-frame .book-canvas {
            transform: scale(0.465);
            transform-origin: top left;
        }


        /* =========================================================
           책등 세로 제목

           writing-mode를 사용하지 않는다.
           html2canvas에서도 깨지지 않도록
           글자 하나하나를 실제 세로로 배치한다.
        ========================================================= */

        .spine-title-columns {
            position: absolute;

            top: 35px;
            left: 0;

            width: 96px;
            height: 610px;

            display: flex;

            flex-direction: row-reverse;

            justify-content: center;

            align-items: flex-start;

            gap: 3px;

            overflow: hidden;
        }


        .spine-title-column {
            width: 43px;
            height: 570px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            overflow: hidden;

            flex-shrink: 0;
        }


        .spine-title-char {
            display: block;

            width: 43px;

            height: 64px;

            line-height: 64px;

            text-align: center;

            color: #ffffff;

            font-family: 'Gowun Batang', serif;

            font-size: 64px;

            font-weight: 700;

            letter-spacing: 0;

            flex-shrink: 0;
        }


        .minumsa-logo {
            display: block;

            object-fit: contain;

            object-position: center;

            flex-shrink: 0;
        }


        .color-chip {
            transition: transform 0.15s ease;
        }

        .color-chip.selected {
            transform: scale(1.1);
        }


        /* =========================================================
           앞표지 제목 영역
        ========================================================= */

        .front-title-area {
            width: 700px;

            height: 110px;

            margin-top: 28px;

            margin-bottom: 29px;

            display: flex;

            align-items: center;

            overflow: hidden;
        }


        #previewBookTitle {
            width: 700px;

            margin: 0;

            padding: 0;

            font-family: 'Gowun Batang', serif;

            font-size: 83px;

            line-height: 1;

            font-weight: 700;

            letter-spacing: -0.055em;

            color: #111111;

            word-break: keep-all;

            white-space: nowrap;

            overflow: hidden;

            text-align: left;
        }

    </style>
</head>


<body class="bg-slate-100 min-h-screen p-4 md:p-8">

        <button

<script>

    /* =============================================================
       요소
    ============================================================= */

    const seriesNoInput =
        document.getElementById('seriesNoInput');

    const commonTitleInput =
        document.getElementById('commonTitleInput');

    const engTitleInput =
        document.getElementById('engTitleInput');

    const authorInput =
        document.getElementById('authorInput');

    const translatorInput =
        document.getElementById('translatorInput');

    const imageInput =
        document.getElementById('imageInput');

    const authorImageSelect =
        document.getElementById('authorImageSelect');


    const previewSeriesNo =
        document.getElementById('previewSeriesNo');

    const previewSubSeriesNo =
        document.getElementById('previewSubSeriesNo');

    const previewBookTitle =
        document.getElementById('previewBookTitle');

    const previewEngTitle =
        document.getElementById('previewEngTitle');

    const previewAuthor =
        document.getElementById('previewAuthor');

    const previewTranslator =
        document.getElementById('previewTranslator');

    const previewImage =
        document.getElementById('previewImage');

    const imagePlaceholder =
        document.getElementById('imagePlaceholder');

    const portraitImg =
        document.getElementById('portraitImg');

    const spineColorBox =
        document.getElementById('spineColorBox');

    const spineAuthorBox =
        document.getElementById('spineAuthorBox');

    const topBar =
        document.getElementById('topBar');

    const bottomBar =
        document.getElementById('bottomBar');

    const colorChips =
        document.querySelectorAll('.color-chip');

    const downloadBtn =
        document.getElementById('downloadBtn');

    const previewFrame =
        document.getElementById('previewFrame');

    const captureArea =
        document.getElementById('captureArea');

    const spineTitleColumns =
        document.getElementById('spineTitleColumns');

    const spineTitleColumn1 =
        document.getElementById('spineTitleColumn1');

    const spineTitleColumn2 =
        document.getElementById('spineTitleColumn2');



    /* =============================================================
       번호
    ============================================================= */

    function formatSeriesNo(value) {

        const cleaned =
            String(value ?? '')
                .replace(/\D/g, '');

        if (!cleaned) {
            return '001';
        }

        const number =
            parseInt(cleaned, 10);

        if (
            isNaN(number) ||
            number <= 0
        ) {
            return '001';
        }

        return String(
            Math.min(number, 999)
        ).padStart(3, '0');
    }



    function updateSeriesNumber() {

        const value =
            formatSeriesNo(
                seriesNoInput.value
            );

        previewSeriesNo.textContent =
            value;

        previewSubSeriesNo.textContent =
            value;
    }


    seriesNoInput.addEventListener(
        'input',
        updateSeriesNumber
    );



    /* =============================================================
       책등 인물
    ============================================================= */

    authorImageSelect.addEventListener(
        'change',
        function(e) {

            portraitImg.src =
                e.target.value;

        }
    );



    /* =============================================================
       앞표지 제목 크기

       제목 영역은 700×110으로 고정.
       제목은 영역의 세로 중앙.
    ============================================================= */

    function fitTitleAndBars() {

        const MAX_WIDTH =
            700;

        const NORMAL_FONT_SIZE =
            83;

        const MIN_FONT_SIZE =
            42;


        let fontSize =
            NORMAL_FONT_SIZE;


        previewBookTitle.style.fontSize =
            fontSize + 'px';

        previewBookTitle.style.whiteSpace =
            'nowrap';

        previewBookTitle.style.display =
            'block';

        previewBookTitle.style.lineHeight =
            '1';

        previewBookTitle.style.height =
            'auto';

        previewBookTitle.style.overflow =
            'hidden';


        /* ---------------------------------------------------------
           우선 한 줄에서 최대한 크게
        --------------------------------------------------------- */

        while (
            previewBookTitle.scrollWidth >
                MAX_WIDTH &&
            fontSize >
                MIN_FONT_SIZE
        ) {

            fontSize -= 1;

            previewBookTitle.style.fontSize =
                fontSize + 'px';
        }


        /* ---------------------------------------------------------
           그래도 안 들어가면 2줄
        --------------------------------------------------------- */

        if (
            previewBookTitle.scrollWidth >
            MAX_WIDTH
        ) {

            previewBookTitle.style.whiteSpace =
                'normal';

            previewBookTitle.style.display =
                '-webkit-box';

            previewBookTitle.style.webkitBoxOrient =
                'vertical';

            previewBookTitle.style.webkitLineClamp =
                '2';

            previewBookTitle.style.lineHeight =
                '0.9';

            previewBookTitle.style.height =
                '100%';

            previewBookTitle.style.overflow =
                'hidden';

        } else {

            previewBookTitle.style.whiteSpace =
                'nowrap';

            previewBookTitle.style.display =
                'block';

            previewBookTitle.style.webkitLineClamp =
                'unset';

            previewBookTitle.style.lineHeight =
                '1';

            previewBookTitle.style.height =
                'auto';
        }


        /* ---------------------------------------------------------
           색띠 길이
        --------------------------------------------------------- */

        const titleWidth =
            Math.min(
                MAX_WIDTH,
                Math.max(
                    100,
                    previewBookTitle.scrollWidth
                )
            );


        const finalBarWidth =
            Math.min(
                900,
                Math.max(
                    700,
                    titleWidth
                )
            );


        topBar.style.width =
            finalBarWidth + 'px';

        bottomBar.style.width =
            finalBarWidth + 'px';


        previewEngTitle.style.maxWidth =
            Math.max(
                50,
                finalBarWidth - 42
            ) + 'px';

    }



    /* =============================================================
       책등 제목 글자 생성
    ============================================================= */

    function makeSpineCharacters(
        container,
        text,
        fontSize
    ) {

        container.innerHTML =
            '';


        const chars =
            Array.from(
                text
            );


        chars.forEach(
            function(char) {

                const span =
                    document.createElement(
                        'span'
                    );


                span.className =
                    'spine-title-char';


                span.textContent =
                    char === ' '
                        ? '\u00A0'
                        : char;


                span.style.fontSize =
                    fontSize + 'px';


                span.style.height =
                    fontSize + 'px';


                span.style.lineHeight =
                    fontSize + 'px';


                container.appendChild(
                    span
                );

            }
        );

    }



    /* =============================================================
       책등 제목

       ★ writing-mode를 사용하지 않음 ★

       1열:
       글자 하나
       글자 하나
       글자 하나
       ...

       긴 제목:
       오른쪽 열
       글자
       글자
       글자

       왼쪽 열
       글자
       글자
       글자
    ============================================================= */

    function fitSpineTitle() {

        const title =
            commonTitleInput.value ||
            '오만과 편견';


        const MAX_ONE_COLUMN_HEIGHT =
            570;

        const MAX_TWO_COLUMN_HEIGHT =
            570;

        const MAX_FONT =
            64;

        const MIN_FONT =
            24;


        /* ---------------------------------------------------------
           우선 1열 64px
        --------------------------------------------------------- */

        let fontSize =
            MAX_FONT;


        let charCount =
            Array.from(title).length;


        /*
         * 글자 하나의 높이는 fontSize와 동일하게 사용한다.
         */

        let oneColumnHeight =
            charCount * fontSize;


        while (
            oneColumnHeight >
                MAX_ONE_COLUMN_HEIGHT &&
            fontSize >
                MIN_FONT
        ) {

            fontSize -= 1;

            oneColumnHeight =
                charCount * fontSize;
        }


        /* ---------------------------------------------------------
           1열로 들어가는 경우
        --------------------------------------------------------- */

        if (
            oneColumnHeight <=
            MAX_ONE_COLUMN_HEIGHT
        ) {

            makeSpineCharacters(
                spineTitleColumn1,
                title,
                fontSize
            );


            spineTitleColumn2.innerHTML =
                '';


            spineTitleColumn2.style.display =
                'none';


            spineTitleColumn1.style.display =
                'flex';


            spineTitleColumn1.style.width =
                '43px';


            spineTitleColumns.style.flexDirection =
                'row';


            return;
        }



        /* =========================================================
           긴 제목 → 2열
        ========================================================= */


        spineTitleColumn1.style.display =
            'flex';

        spineTitleColumn2.style.display =
            'flex';


        spineTitleColumns.style.flexDirection =
            'row-reverse';


        /*
         * 2열에서는 최대한 큰 글자를 사용하되
         * 각 열이 570px 안에 들어가도록 한다.
         */

        let twoFont =
            64;


        const chars =
            Array.from(title);


        /*
         * 먼저 균등하게 나눈다.
         */

        let splitIndex =
            Math.ceil(
                chars.length / 2
            );


        let firstChars =
            chars.slice(
                0,
                splitIndex
            );

        let secondChars =
            chars.slice(
                splitIndex
            );


        /*
         * 두 열 중 긴 쪽의 글자 수를 기준으로
         * 폰트 크기를 결정한다.
         */

        let longestCount =
            Math.max(
                firstChars.length,
                secondChars.length
            );


        while (
            longestCount * twoFont >
                MAX_TWO_COLUMN_HEIGHT &&
            twoFont >
                MIN_FONT
        ) {

            twoFont -= 1;
        }


        /* ---------------------------------------------------------
           실제 생성
        --------------------------------------------------------- */

        makeSpineCharacters(
            spineTitleColumn1,
            firstChars.join(''),
            twoFont
        );


        makeSpineCharacters(
            spineTitleColumn2,
            secondChars.join(''),
            twoFont
        );


        spineTitleColumn1.style.width =
            '43px';

        spineTitleColumn2.style.width =
            '43px';


        spineTitleColumn1.style.height =
            MAX_TWO_COLUMN_HEIGHT + 'px';

        spineTitleColumn2.style.height =
            MAX_TWO_COLUMN_HEIGHT + 'px';

    }



    /* =============================================================
       책등 저자

       위치 고정
    ============================================================= */

    function fitSpineAuthor() {

        spineAuthorBox.style.top =
            '700px';

    }



    /* =============================================================
       제목 변경
    ============================================================= */

    commonTitleInput.addEventListener(
        'input',
        function(e) {

            const value =
                e.target.value ||
                '오만과 편견';


            previewBookTitle.textContent =
                value;


            fitTitleAndBars();

            fitSpineTitle();

        }
    );



    /* =============================================================
       영문 제목
    ============================================================= */

    engTitleInput.addEventListener(
        'input',
        function(e) {

            previewEngTitle.textContent =
                e.target.value ||
                'Pride and Prejudice';

        }
    );



    /* =============================================================
       저자
    ============================================================= */

    authorInput.addEventListener(
        'input',
        function(e) {

            const value =
                e.target.value ||
                '제인 오스틴';


            previewAuthor.textContent =
                value;

            previewSpineAuthor.textContent =
                value;

        }
    );



    /* =============================================================
       역자
    ============================================================= */

    translatorInput.addEventListener(
        'input',
        function(e) {

            previewTranslator.textContent =
                e.target.value;

        }
    );



    /* =============================================================
       이미지 업로드

       원본 비율 유지
       crop 방식
    ============================================================= */

    imageInput.addEventListener(
        'change',
        function(e) {

            const file =
                e.target.files[0];


            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    previewImage.onload =
                        function() {

                            previewImage.style.display =
                                'block';

                            imagePlaceholder.style.display =
                                'none';

                        };


                    previewImage.src =
                        event.target.result;

                };


            reader.readAsDataURL(file);

        }
    );



    /* =============================================================
       색상
    ============================================================= */

    colorChips.forEach(
        function(chip) {

            chip.addEventListener(
                'click',
                function() {


                    colorChips.forEach(
                        function(c) {

                            c.classList.remove(
                                'selected',
                                'ring-2',
                                'ring-indigo-600',
                                'ring-offset-2'
                            );

                        }
                    );


                    chip.classList.add(
                        'selected',
                        'ring-2',
                        'ring-indigo-600',
                        'ring-offset-2'
                    );


                    const color =
                        chip.dataset.color;


                    spineColorBox.style.backgroundColor =
                        color;

                    topBar.style.backgroundColor =
                        color;

                    bottomBar.style.backgroundColor =
                        color;

                }
            );

        }
    );



    /* =============================================================
       이미지 로딩 대기
    ============================================================= */

    function waitForImages(container) {

        const images =
            container.querySelectorAll('img');


        return Promise.all(

            Array.from(images).map(
                function(img) {

                    if (
                        img.complete &&
                        img.naturalWidth > 0
                    ) {

                        return Promise.resolve();

                    }


                    return new Promise(
                        function(resolve) {

                            const done =
                                function() {
                                    resolve();
                                };


                            img.addEventListener(
                                'load',
                                done,
                                { once:true }
                            );


                            img.addEventListener(
                                'error',
                                done,
                                { once:true }
                            );

                        }
                    );

                }
            )

        );

    }



    /* =============================================================
       PNG 다운로드

       ★ 중요 ★

       미리보기의 0.465배 화면을 캡처하지 않는다.

       실제 1080×1720 canvas를 그대로 캡처한다.

       그래서:
       - 세로쓰기 깨짐 방지
       - 이미지 찌그러짐 방지
       - 제목 위치 틀어짐 방지
       - 미리보기와 실제 디자인 구조 동일
    ============================================================= */

    downloadBtn.addEventListener(
        'click',
        async function() {

            downloadBtn.disabled =
                true;


            downloadBtn.textContent =
                '✨ PNG 생성 중...';


            try {


                /* -------------------------------------------------
                   번호
                ------------------------------------------------- */

                const fileNumber =
                    formatSeriesNo(
                        seriesNoInput.value
                    );


                previewSeriesNo.textContent =
                    fileNumber;

                previewSubSeriesNo.textContent =
                    fileNumber;



                /* -------------------------------------------------
                   폰트
                ------------------------------------------------- */

                if (document.fonts) {

                    await document.fonts.ready;

                }



                /* -------------------------------------------------
                   이미지
                ------------------------------------------------- */

                await waitForImages(
                    captureArea
                );



                /* -------------------------------------------------
                   렌더링 안정화
                ------------------------------------------------- */

                await new Promise(
                    function(resolve) {

                        requestAnimationFrame(
                            function() {

                                requestAnimationFrame(
                                    resolve
                                );

                            }
                        );

                    }
                );



                /* -------------------------------------------------
                   실제 캔버스 캡처

                   transform을 사용한 미리보기 프레임이 아니라
                   실제 1080×1720 디자인을 캡처한다.
                ------------------------------------------------- */

                const exportCanvas =
                    await html2canvas(
                        captureArea,
                        {

                            width:1080,

                            height:1720,

                            scale:1,

                            backgroundColor:null,

                            useCORS:true,

                            allowTaint:false,

                            imageTimeout:0,

                            logging:false,

                            removeContainer:true,

                            scrollX:0,

                            scrollY:0

                        }
                    );



                /* -------------------------------------------------
                   최종 PNG 캔버스

                   혹시 html2canvas가 미세하게 다른 크기를
                   반환하더라도 최종 규격은 항상 1080×1720
                ------------------------------------------------- */

                const finalCanvas =
                    document.createElement(
                        'canvas'
                    );


                finalCanvas.width =
                    1080;

                finalCanvas.height =
                    1720;


                const ctx =
                    finalCanvas.getContext(
                        '2d'
                    );


                ctx.clearRect(
                    0,
                    0,
                    1080,
                    1720
                );


                ctx.drawImage(
                    exportCanvas,
                    0,
                    0,
                    exportCanvas.width,
                    exportCanvas.height,
                    0,
                    0,
                    1080,
                    1720
                );



                /* -------------------------------------------------
                   PNG Blob
                ------------------------------------------------- */

                const blob =
                    await new Promise(
                        function(resolve) {

                            finalCanvas.toBlob(
                                resolve,
                                'image/png'
                            );

                        }
                    );


                if (!blob) {

                    throw new Error(
                        'PNG Blob 생성 실패'
                    );

                }



                /* -------------------------------------------------
                   파일명

                   예:
                   북커버_020.png
                ------------------------------------------------- */

                const fileName =
                    '북커버_' +
                    fileNumber +
                    '.png';


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement('a');


                link.href =
                    url;


                link.download =
                    fileName;


                link.setAttribute(
                    'download',
                    fileName
                );


                link.style.display =
                    'none';


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    function() {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );

            }


            catch(error) {

                console.error(
                    'PNG 생성 오류:',
                    error
                );


                alert(
                    'PNG 생성 중 오류가 발생했습니다.\n' +
                    '잠시 후 다시 시도해주세요.'
                );

            }


            finally {

                downloadBtn.disabled =
                    false;


                downloadBtn.textContent =
                    '✨ 고화질 투명 PNG 다운로드';

            }

        }
    );



    /* =============================================================
       최초 실행
    ============================================================= */

    async function initialize() {

        if (document.fonts) {

            await document.fonts.ready;

        }


        updateSeriesNumber();

        fitTitleAndBars();

        fitSpineTitle();

        fitSpineAuthor();

    }


    window.addEventListener(
        'load',
        initialize
    );

</script>
