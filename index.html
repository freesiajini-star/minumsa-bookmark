<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>삼삼오오전집 투명 책갈피 제작소</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');


        /* =========================================================
           기본
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .font-batang {
            font-family: 'Gowun Batang', serif;
        }

        .font-sans-kr {
            font-family: 'Noto Sans KR', sans-serif;
        }


        /* =========================================================
           실제 출력 규격

           54 : 86
           1080 : 1720
        ========================================================= */

        :root {

            --canvas-w: 1080px;
            --canvas-h: 1720px;

            /* 책등 */
            --spine-w: 97px;

            /* 앞표지 */
            --front-w: 983px;

            /* 앞표지 일러스트 = 전체 높이의 정확히 40% */
            --image-h: 688px;

            /* 민음사 계열 색상 */
            --main-color: #A61D4B;
        }


        /* =========================================================
           실제 PNG 캔버스

           ★ 배경 투명
        ========================================================= */

        .book-canvas {

            width: var(--canvas-w);
            height: var(--canvas-h);

            position: relative;

            display: flex;

            background: transparent;

            overflow: hidden;
        }


        /* =========================================================
           화면 미리보기

           약 1.5배 확대해서 보이도록 설정
        ========================================================= */

        .preview-frame {

            width: 502px;
            height: 800px;

            position: relative;

            overflow: hidden;

            background:
                repeating-conic-gradient(
                    #f1f5f9 0% 25%,
                    #ffffff 0% 50%
                )
                50% / 16px 16px;

            border-radius: 14px;

            flex-shrink: 0;
        }

        .preview-frame .book-canvas {

            transform: scale(0.465);

            transform-origin: top left;
        }


        /* =========================================================
           책등 세로쓰기

           ★ 줄바꿈 절대 금지
        ========================================================= */

        .spine-vertical {

            writing-mode: vertical-rl;

            text-orientation: upright;

            white-space: nowrap;

            word-break: keep-all;

            overflow: visible;

            flex-shrink: 0;
        }


        /* =========================================================
           민음사 로고
        ========================================================= */

        .minumsa-logo {

            display: block;

            object-fit: contain;

            object-position: center;

            flex-shrink: 0;
        }


        /* =========================================================
           색상 버튼
        ========================================================= */

        .color-chip {
            transition: transform 0.15s ease;
        }

        .color-chip.selected {
            transform: scale(1.1);
        }

    </style>
</head>


<body class="bg-slate-100 min-h-screen p-4 md:p-8">


<div
    class="max-w-[1400px] mx-auto bg-white rounded-2xl shadow-xl overflow-hidden
           grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_560px]"
>


    <!-- =============================================================
         왼쪽 설정
    ============================================================== -->

    <div
        class="p-6 md:p-8 flex flex-col justify-between
               border-b lg:border-b-0 lg:border-r border-slate-200"
    >

        <div class="space-y-4">


            <h1 class="text-2xl font-bold text-slate-800">
                📚 삼삼오오전집 투명 책갈피
            </h1>


            <p class="text-xs text-slate-500">
                스냅스 포토카드 54:86 · 1080×1720px · 투명 PNG
            </p>


            <!-- 제작자 -->

            <div>

                <label class="block text-sm font-semibold text-slate-700 mb-1">
                    제작자 정보
                </label>

                <input
                    type="text"
                    id="studentInfoInput"
                    placeholder="3학년 5반 홍길동"
                    class="w-full px-3 py-2 border rounded-lg outline-none
                           focus:ring-2 focus:ring-indigo-500"
                >

            </div>


            <!-- 일러스트 -->

            <div>

                <label class="block text-sm font-semibold text-slate-700 mb-1">
                    상단 일러스트 이미지
                </label>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    class="w-full text-sm text-slate-500
                           file:mr-4 file:py-2 file:px-4
                           file:rounded-full file:border-0
                           file:text-sm file:font-semibold
                           file:bg-indigo-50 file:text-indigo-700
                           hover:file:bg-indigo-100 cursor-pointer"
                >

                <p class="text-[11px] text-slate-400 mt-1">
                    ※ 앞표지 영역에서만 40%를 차지합니다. 책등으로 넘어가지 않습니다.
                </p>

            </div>


            <!-- 번호 / 책등 인물 -->

            <div class="grid grid-cols-2 gap-3">

                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        전집 번호
                    </label>

                    <input
                        type="number"
                        id="seriesNoInput"
                        value="88"
                        min="1"
                        max="999"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        책등 인물
                    </label>

                    <select
                        id="authorImageSelect"
                        class="w-full px-3 py-2 border rounded-lg outline-none bg-white text-sm"
                    >

                        <option value="Jane.png">
                            제인 오스틴
                        </option>

                        <option value="Hankang.png">
                            한강 작가
                        </option>

                        <option value="Sejong.png">
                            세종대왕
                        </option>

                        <option value="Shakespeare.png">
                            셰익스피어
                        </option>

                        <option value="Hwang.png">
                            황석영 작가
                        </option>

                    </select>

                </div>

            </div>


            <!-- 제목 -->

            <div class="grid grid-cols-2 gap-3">

                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        책 제목
                    </label>

                    <input
                        type="text"
                        id="commonTitleInput"
                        value="오만과 편견"
                        maxlength="25"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        영문 원제
                    </label>

                    <input
                        type="text"
                        id="engTitleInput"
                        value="Pride and Prejudice"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>

            </div>


            <!-- 저자 / 역자 -->

            <div class="grid grid-cols-2 gap-3">

                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        저자명
                    </label>

                    <input
                        type="text"
                        id="authorInput"
                        value="제인 오스틴"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        역자명
                    </label>

                    <input
                        type="text"
                        id="translatorInput"
                        value="윤지관, 전승희 옮김"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>

            </div>


            <!-- 색상 -->

            <div>

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    책등 & 띠 컬러
                </label>


                <div class="flex flex-wrap gap-2.5">

                    <button
                        type="button"
                        class="color-chip selected w-8 h-8 rounded-full
                               border-2 border-white shadow-md
                               ring-2 ring-indigo-600 ring-offset-2"
                        style="background:#A61D4B"
                        data-color="#A61D4B"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md"
                        style="background:#1E3A8A"
                        data-color="#1E3A8A"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md"
                        style="background:#065F46"
                        data-color="#065F46"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md"
                        style="background:#581C87"
                        data-color="#581C87"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md"
                        style="background:#B45309"
                        data-color="#B45309"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md"
                        style="background:#111827"
                        data-color="#111827"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md"
                        style="background:#0369A1"
                        data-color="#0369A1"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md"
                        style="background:#9A3412"
                        data-color="#9A3412"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full border-2 border-white shadow-md"
                        style="background:#4D7C0F"
                        data-color="#4D7C0F"
                    ></button>

                </div>

            </div>

        </div>


        <!-- 다운로드 -->

        <button
            id="downloadBtn"
            class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700
                   text-white font-semibold py-3 rounded-xl
                   transition shadow-md"
        >
            ✨ 고화질 투명 PNG 다운로드
        </button>

    </div>



    <!-- =============================================================
         오른쪽 미리보기
    ============================================================== -->

    <div
        class="p-6 md:p-8 bg-slate-50 flex flex-col
               items-center justify-start overflow-auto"
    >

        <p class="text-xs font-medium text-slate-400 mb-3">
            실시간 미리보기 · 54:86 · 일러스트 40%
        </p>


        <div class="preview-frame">


            <!-- =====================================================
                 실제 1080 × 1720 캔버스
            ====================================================== -->

            <div
                id="captureArea"
                class="book-canvas"
            >


                <!-- =================================================
                     ★★★★★ 책등 ★★★★★

                     97px × 1720px

                     일러스트와 완전히 독립
                ================================================== -->

                <div
                    id="spine"
                    style="
                        width:97px;
                        height:1720px;
                        position:relative;
                        flex-shrink:0;
                        background:#ffffff;
                        border-right:1px solid #cbd5e1;
                    "
                >


                    <!-- -------------------------------------------------
                         책등 상단
                    -------------------------------------------------- -->

                    <div
                        style="
                            position:absolute;
                            top:0;
                            left:0;
                            width:97px;
                            height:430px;
                            background:#ffffff;
                        "
                    >


                        <!-- 전집 번호 -->

                        <div
                            class="font-sans-kr"
                            style="
                                position:absolute;
                                top:38px;
                                left:0;
                                width:97px;

                                text-align:center;

                                font-size:17px;
                                font-weight:700;

                                color:#111111;
                            "
                        >

                            <span id="previewSeriesNo">
                                088
                            </span>

                        </div>


                        <!-- 세계문학전집 -->

                        <div
                            class="font-sans-kr"
                            style="
                                position:absolute;
                                top:76px;
                                left:0;
                                width:97px;

                                text-align:center;

                                font-size:13px;
                                line-height:1.25;

                                font-weight:700;

                                color:#111111;
                            "
                        >

                            세계<br>
                            문학<br>
                            전집

                        </div>


                        <!-- -------------------------------------------------
                             작가 초상

                             원본처럼 책등 상단의 흰색 영역 안에
                             흑백 초상
                        -------------------------------------------------- -->

                        <div
                            style="
                                position:absolute;
                                top:170px;
                                left:0;

                                width:97px;
                                height:150px;

                                overflow:hidden;

                                background:#e5e7eb;
                            "
                        >

                            <img
                                id="portraitImg"
                                src="Jane.png"
                                alt="작가 초상"
                                style="
                                    display:block;

                                    width:100%;
                                    height:100%;

                                    object-fit:cover;

                                    filter:
                                        grayscale(100%)
                                        contrast(115%);
                                "
                                onerror="
                                    this.style.display='none';
                                "
                            >

                        </div>

                    </div>


                    <!-- =================================================
                         ★ 책등 자주색 영역

                         제목 + 저자를 세로 한 줄로 배치

                         제목 : 크고
                         저자 : 작게
                         둘 다 같은 세로 방향
                    ================================================== -->

                    <div
                        id="spineColorBox"
                        style="
                            position:absolute;

                            top:430px;
                            left:0;

                            width:97px;
                            height:1030px;

                            background:#A61D4B;

                            display:flex;

                            flex-direction:column;

                            align-items:center;

                            justify-content:flex-start;

                            overflow:hidden;
                        "
                    >


                        <!-- -------------------------------------------------
                             큰 책 제목

                             ★ 책등에서 가장 크게
                        -------------------------------------------------- -->

                        <div
                            style="
                                position:absolute;

                                top:55px;
                                left:0;

                                width:97px;

                                display:flex;

                                justify-content:center;
                            "
                        >

                            <span
                                id="previewSpineTitle"
                                class="spine-vertical font-batang"
                                style="
                                    color:#ffffff;

                                    font-size:29px;

                                    font-weight:700;

                                    line-height:1;

                                    letter-spacing:0.02em;

                                    max-height:650px;
                                "
                            >
                                오만과 편견
                            </span>

                        </div>


                        <!-- -------------------------------------------------
                             작은 저자

                             ★ 제목 밑
                             ★ 제목과 좌우로 나뉘지 않음
                        -------------------------------------------------- -->

                        <div
                            style="
                                position:absolute;

                                top:720px;
                                left:0;

                                width:97px;

                                display:flex;

                                justify-content:center;
                            "
                        >

                            <span
                                id="previewSpineAuthor"
                                class="spine-vertical font-sans-kr"
                                style="
                                    color:#ffffff;

                                    font-size:17px;

                                    font-weight:500;

                                    line-height:1;

                                    letter-spacing:0.08em;

                                    max-height:300px;
                                "
                            >
                                제인 오스틴
                            </span>

                        </div>


                    </div>


                    <!-- =================================================
                         책등 하단

                         민음사 PNG
                    ================================================== -->

                    <div
                        style="
                            position:absolute;

                            left:0;
                            bottom:0;

                            width:97px;
                            height:260px;

                            background:#ffffff;

                            display:flex;

                            align-items:flex-end;

                            justify-content:center;

                            padding-bottom:58px;
                        "
                    >

                        <img
                            src="./minumsa.png"
                            alt="민음사"
                            class="minumsa-logo"
                            style="
                                width:70px;
                                height:40px;
                            "
                        >

                    </div>


                </div>



                <!-- =================================================
                     ★★★★★ 앞표지 ★★★★★

                     983px × 1720px
                ================================================== -->

                <div
                    id="frontCover"
                    style="
                        width:983px;
                        height:1720px;

                        position:relative;

                        flex-shrink:0;

                        background:transparent;
                    "
                >


                    <!-- =================================================
                         ★ 일러스트

                         전체 카드 높이의 40%
                         = 688px

                         ★★★★★
                         앞표지 폭 안에서만 존재
                         ★★★★★
                    ================================================== -->

                    <div
                        style="
                            position:absolute;

                            top:0;
                            left:0;

                            width:983px;
                            height:688px;

                            overflow:hidden;

                            background:transparent;
                        "
                    >

                        <img
                            id="previewImage"
                            src=""
                            alt=""
                            style="
                                display:none;

                                width:100%;
                                height:100%;

                                object-fit:cover;
                            "
                        >


                        <div
                            id="imagePlaceholder"
                            class="font-sans-kr"
                            style="
                                position:absolute;

                                inset:0;

                                display:flex;

                                align-items:center;
                                justify-content:center;

                                background:#f8fafc;

                                color:#94a3b8;

                                font-size:20px;
                            "
                        >
                            앞표지 일러스트 · 40%
                        </div>

                    </div>



                    <!-- =================================================
                         앞표지 하단

                         ★ 배경 없음
                         ★ 실제 PNG에서 투명
                    ================================================== -->

                    <div
                        style="
                            position:absolute;

                            top:688px;
                            left:0;

                            width:983px;
                            height:1032px;

                            background:transparent;
                        "
                    >


                        <!-- =================================================
                             앞표지 텍스트 전체
                        ================================================== -->

                        <div
                            style="
                                position:absolute;

                                left:59px;
                                top:42px;

                                width:700px;
                            "
                        >


                            <!-- ---------------------------------------------
                                 세계문학전집 88
                            ---------------------------------------------- -->

                            <div
                                class="font-sans-kr"
                                style="
                                    margin-left:17px;

                                    font-size:22px;

                                    line-height:1;

                                    font-weight:700;

                                    color:#111111;
                                "
                            >

                                세계문학전집

                                <span id="previewSubSeriesNo">
                                    088
                                </span>

                            </div>


                            <!-- ---------------------------------------------
                                 위쪽 컬러 띠
                            ---------------------------------------------- -->

                            <div
                                id="topBar"
                                style="
                                    width:500px;
                                    height:55px;

                                    margin-top:28px;

                                    background:#A61D4B;
                                "
                            >
                            </div>


                            <!-- ---------------------------------------------
                                 큰 제목

                                 원본 느낌을 위해 크게
                            ---------------------------------------------- -->

                            <div
                                id="previewBookTitle"
                                class="font-batang"
                                style="
                                    width:650px;

                                    margin-top:28px;
                                    margin-bottom:29px;

                                    font-size:69px;

                                    line-height:1.15;

                                    font-weight:400;

                                    letter-spacing:-0.055em;

                                    color:#111111;

                                    word-break:keep-all;

                                    white-space:nowrap;

                                    overflow:hidden;

                                    text-overflow:clip;
                                "
                            >
                                오만과 편견
                            </div>


                            <!-- ---------------------------------------------
                                 영문 제목 띠
                            ---------------------------------------------- -->

                            <div
                                id="bottomBar"
                                style="
                                    width:500px;
                                    height:55px;

                                    display:flex;

                                    align-items:center;

                                    padding-left:21px;

                                    background:#A61D4B;
                                "
                            >

                                <span
                                    id="previewEngTitle"
                                    class="font-sans-kr"
                                    style="
                                        color:#ffffff;

                                        font-size:19px;

                                        font-weight:500;

                                        white-space:nowrap;

                                        overflow:hidden;

                                        text-overflow:ellipsis;

                                        max-width:455px;
                                    "
                                >
                                    Pride and Prejudice
                                </span>

                            </div>


                            <!-- ---------------------------------------------
                                 저자 / 역자

                                 원본처럼 저자는 크고
                                 역자는 오른쪽에 작게
                            ---------------------------------------------- -->

                            <div
                                class="font-sans-kr"
                                style="
                                    display:flex;

                                    align-items:baseline;

                                    margin-top:29px;

                                    margin-left:17px;
                                "
                            >

                                <span
                                    id="previewAuthor"
                                    style="
                                        font-size:27px;

                                        font-weight:700;

                                        color:#111111;

                                        white-space:nowrap;
                                    "
                                >
                                    제인 오스틴
                                </span>


                                <span
                                    id="previewTranslator"
                                    style="
                                        font-size:18px;

                                        font-weight:400;

                                        color:#111111;

                                        margin-left:17px;

                                        white-space:nowrap;
                                    "
                                >
                                    윤지관, 전승희 옮김
                                </span>

                            </div>


                            <!-- 제작자 -->

                            <div
                                class="font-sans-kr"
                                style="
                                    margin-top:14px;

                                    margin-left:17px;

                                    font-size:18px;

                                    color:#64748b;
                                "
                            >

                                <span id="previewStudentInfo">
                                    3학년 5반 홍길동
                                </span>

                            </div>


                        </div>



                        <!-- =================================================
                             앞표지 하단 민음사

                             ★ PNG만 존재
                             ★ 주변은 투명
                        ================================================== -->

                        <div
                            style="
                                position:absolute;

                                left:59px;
                                bottom:61px;

                                display:flex;

                                align-items:center;
                            "
                        >

                            <img
                                src="./minumsa.png"
                                alt="민음사"
                                class="minumsa-logo"
                                style="
                                    width:76px;
                                    height:42px;
                                "
                            >

                        </div>


                    </div>


                </div>


            </div>

        </div>


        <p class="text-[11px] text-slate-400 mt-4 text-center">
            ※ 최종 PNG 1080×1720px · 54:86 · 앞표지 사진 40% · 빈 공간 투명
        </p>

    </div>

</div>



<script>


    /* =============================================================
       요소
    ============================================================= */

    const studentInfoInput =
        document.getElementById('studentInfoInput');

    const seriesNoInput =
        document.getElementById('seriesNoInput');

    const commonTitleInput =
        document.getElementById('commonTitleInput');

    const engTitleInput =
        document.getElementById('engTitleInput');

    const authorInput =
        document.getElementById('authorInput');

    const translatorInput =
        document.getElementById('translatorInput');

    const imageInput =
        document.getElementById('imageInput');

    const authorImageSelect =
        document.getElementById('authorImageSelect');


    /* 미리보기 */

    const previewSeriesNo =
        document.getElementById('previewSeriesNo');

    const previewSubSeriesNo =
        document.getElementById('previewSubSeriesNo');

    const previewSpineTitle =
        document.getElementById('previewSpineTitle');

    const previewSpineAuthor =
        document.getElementById('previewSpineAuthor');

    const previewBookTitle =
        document.getElementById('previewBookTitle');

    const previewEngTitle =
        document.getElementById('previewEngTitle');

    const previewAuthor =
        document.getElementById('previewAuthor');

    const previewTranslator =
        document.getElementById('previewTranslator');

    const previewStudentInfo =
        document.getElementById('previewStudentInfo');

    const previewImage =
        document.getElementById('previewImage');

    const imagePlaceholder =
        document.getElementById('imagePlaceholder');

    const portraitImg =
        document.getElementById('portraitImg');


    /* 컬러 */

    const spineColorBox =
        document.getElementById('spineColorBox');

    const topBar =
        document.getElementById('topBar');

    const bottomBar =
        document.getElementById('bottomBar');

    const colorChips =
        document.querySelectorAll('.color-chip');


    /* 다운로드 */

    const downloadBtn =
        document.getElementById('downloadBtn');

    const captureArea =
        document.getElementById('captureArea');



    /* =============================================================
       번호
    ============================================================= */

    function formatSeriesNo(value) {

        const number =
            parseInt(value, 10);

        if (
            isNaN(number) ||
            number <= 0
        ) {
            return '001';
        }

        return String(number).padStart(3, '0');
    }


    seriesNoInput.addEventListener(
        'input',
        function(e) {

            const value =
                formatSeriesNo(e.target.value);

            previewSeriesNo.textContent =
                value;

            previewSubSeriesNo.textContent =
                value;

        }
    );



    /* =============================================================
       책등 인물
    ============================================================= */

    authorImageSelect.addEventListener(
        'change',
        function(e) {

            portraitImg.src =
                e.target.value;

        }
    );



    /* =============================================================
       제목
    ============================================================= */

    commonTitleInput.addEventListener(
        'input',
        function(e) {

            const value =
                e.target.value || '오만과 편견';

            previewBookTitle.textContent =
                value;

            previewSpineTitle.textContent =
                value;

        }
    );



    /* =============================================================
       영문 제목
    ============================================================= */

    engTitleInput.addEventListener(
        'input',
        function(e) {

            previewEngTitle.textContent =
                e.target.value || 'Pride and Prejudice';

        }
    );



    /* =============================================================
       저자
    ============================================================= */

    authorInput.addEventListener(
        'input',
        function(e) {

            const value =
                e.target.value || '제인 오스틴';

            previewAuthor.textContent =
                value;

            previewSpineAuthor.textContent =
                value;

        }
    );



    /* =============================================================
       역자
    ============================================================= */

    translatorInput.addEventListener(
        'input',
        function(e) {

            previewTranslator.textContent =
                e.target.value;

        }
    );



    /* =============================================================
       제작자
    ============================================================= */

    studentInfoInput.addEventListener(
        'input',
        function(e) {

            previewStudentInfo.textContent =
                e.target.value || '3학년 5반 홍길동';

        }
    );



    /* =============================================================
       일러스트 업로드

       ★ 앞표지에만 들어감
       ★ 책등과 완전히 별개
    ============================================================= */

    imageInput.addEventListener(
        'change',
        function(e) {

            const file =
                e.target.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    previewImage.src =
                        event.target.result;

                    previewImage.style.display =
                        'block';

                    imagePlaceholder.style.display =
                        'none';

                };


            reader.readAsDataURL(file);

        }
    );



    /* =============================================================
       컬러 변경
    ============================================================= */

    colorChips.forEach(
        function(chip) {

            chip.addEventListener(
                'click',
                function() {


                    colorChips.forEach(
                        function(c) {

                            c.classList.remove(
                                'selected',
                                'ring-2',
                                'ring-indigo-600',
                                'ring-offset-2'
                            );

                        }
                    );


                    chip.classList.add(
                        'selected',
                        'ring-2',
                        'ring-indigo-600',
                        'ring-offset-2'
                    );


                    const color =
                        chip.dataset.color;


                    spineColorBox.style.backgroundColor =
                        color;

                    topBar.style.backgroundColor =
                        color;

                    bottomBar.style.backgroundColor =
                        color;

                }
            );

        }
    );



    /* =============================================================
       다운로드

       ★ 1080 × 1720
       ★ transparent PNG
    ============================================================= */

    downloadBtn.addEventListener(
        'click',
        async function() {

            const info =
                studentInfoInput.value.trim() ||
                '학생';


            downloadBtn.disabled =
                true;

            downloadBtn.textContent =
                '✨ PNG 생성 중...';


            try {

                const canvas =
                    await html2canvas(
                        captureArea,
                        {

                            scale:1,

                            /*
                             * 핵심
                             * 캔버스 바깥은 투명
                             */
                            backgroundColor:null,

                            useCORS:true,

                            allowTaint:false,

                            imageTimeout:0

                        }
                    );


                const link =
                    document.createElement('a');


                link.download =
                    `삼삼오오전집_${info}.png`;


                link.href =
                    canvas.toDataURL(
                        'image/png'
                    );


                link.click();

            }

            catch(error) {

                console.error(error);

                alert(
                    'PNG 생성 중 오류가 발생했습니다.'
                );

            }

            finally {

                downloadBtn.disabled =
                    false;

                downloadBtn.textContent =
                    '✨ 고화질 투명 PNG 다운로드';

            }

        }
    );


</script>

</body>
</html>
