<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>봉산삼오전집 투명 책갈피 제작소</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');


        /* =========================================================
           기본
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .font-batang {
            font-family: 'Gowun Batang', serif;
        }

        .font-sans-kr {
            font-family: 'Noto Sans KR', sans-serif;
        }


        /* =========================================================
           실제 출력 규격

           스냅스 포토카드
           54 : 86

           1080 × 1720 px
        ========================================================= */

        :root {

            --canvas-w: 1080px;
            --canvas-h: 1720px;

            /* 책등 */
            --spine-w: 97px;

            /* 앞표지 */
            --front-w: 983px;

            /* 앞표지 사진 45% */
            --image-h: 774px;

            /* 앞표지 투명/텍스트 영역 55% */
            --transparent-h: 946px;

            /* 기본 컬러 */
            --main-color: #A61D4B;
        }


        /* =========================================================
           실제 출력 캔버스

           ★ 전체 배경 투명
        ========================================================= */

        .book-canvas {

            width: var(--canvas-w);
            height: var(--canvas-h);

            position: relative;

            display: flex;

            background: transparent;

            overflow: hidden;
        }


        /* =========================================================
           실시간 미리보기
        ========================================================= */

        .preview-frame {

            width: 502px;
            height: 800px;

            position: relative;

            overflow: hidden;

            flex-shrink: 0;

            background:
                repeating-conic-gradient(
                    #f1f5f9 0% 25%,
                    #ffffff 0% 50%
                )
                50% / 16px 16px;

            border-radius: 14px;
        }


        .preview-frame .book-canvas {

            transform: scale(0.465);

            transform-origin: top left;
        }


        /* =========================================================
           책등 세로쓰기

           ★ 절대 2열로 넘어가지 않음
        ========================================================= */

        .spine-vertical {

            writing-mode: vertical-rl;

            text-orientation: upright;

            white-space: nowrap !important;

            word-break: keep-all !important;

            overflow: visible;

            display: block;

            width: max-content;

            height: max-content;

            max-width: none !important;

            max-height: none !important;

            flex-shrink: 0;
        }


        /* =========================================================
           민음사 로고
        ========================================================= */

        .minumsa-logo {

            display: block;

            object-fit: contain;

            object-position: center;

            flex-shrink: 0;
        }


        /* =========================================================
           색상 버튼
        ========================================================= */

        .color-chip {
            transition: transform 0.15s ease;
        }

        .color-chip.selected {
            transform: scale(1.1);
        }

    </style>
</head>



<body class="bg-slate-100 min-h-screen p-4 md:p-8">


<div
    class="max-w-[1400px] mx-auto bg-white rounded-2xl shadow-xl overflow-hidden
           grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_560px]"
>


    <!-- =============================================================
         왼쪽 설정
    ============================================================== -->

    <div
        class="p-6 md:p-8 flex flex-col justify-between
               border-b lg:border-b-0 lg:border-r border-slate-200"
    >

        <div class="space-y-4">


            <h1 class="text-2xl font-bold text-slate-800">
                📚 봉산삼오전집 투명 책갈피
            </h1>


            <p class="text-xs text-slate-500">
                스냅스 포토카드 54:86 · 1080×1720px · 투명 PNG
            </p>


            <!-- =====================================================
                 일러스트
            ====================================================== -->

            <div>

                <label class="block text-sm font-semibold text-slate-700 mb-1">
                    상단 일러스트 이미지
                </label>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    class="w-full text-sm text-slate-500
                           file:mr-4 file:py-2 file:px-4
                           file:rounded-full file:border-0
                           file:text-sm file:font-semibold
                           file:bg-indigo-50 file:text-indigo-700
                           hover:file:bg-indigo-100 cursor-pointer"
                >

                <p class="text-[11px] text-slate-400 mt-1">
                    ※ 앞표지 상단 45% 영역에만 들어갑니다.
                </p>

            </div>


            <!-- =====================================================
                 번호 / 책등 인물
            ====================================================== -->

            <div class="grid grid-cols-2 gap-3">

                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        전집 번호
                    </label>

                    <input
                        type="number"
                        id="seriesNoInput"
                        value="88"
                        min="1"
                        max="999"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        책등 인물
                    </label>

                    <select
                        id="authorImageSelect"
                        class="w-full px-3 py-2 border rounded-lg
                               outline-none bg-white text-sm"
                    >

                        <option value="Jane.png">
                            제인 오스틴
                        </option>

                        <option value="Hankang.png">
                            한강 작가
                        </option>

                        <option value="Sejong.png">
                            세종대왕
                        </option>

                        <option value="Shakespeare.png">
                            셰익스피어
                        </option>

                        <option value="Hwang.png">
                            황석영 작가
                        </option>

                    </select>

                </div>

            </div>


            <!-- =====================================================
                 제목
            ====================================================== -->

            <div class="grid grid-cols-2 gap-3">

                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        책 제목
                    </label>

                    <input
                        type="text"
                        id="commonTitleInput"
                        value="오만과 편견"
                        maxlength="40"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        영문 원제
                    </label>

                    <input
                        type="text"
                        id="engTitleInput"
                        value="Pride and Prejudice"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>

            </div>


            <!-- =====================================================
                 저자 / 역자
            ====================================================== -->

            <div class="grid grid-cols-2 gap-3">

                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        저자명
                    </label>

                    <input
                        type="text"
                        id="authorInput"
                        value="제인 오스틴"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-1">
                        역자명
                    </label>

                    <input
                        type="text"
                        id="translatorInput"
                        value="윤지관, 전승희 옮김"
                        class="w-full px-3 py-2 border rounded-lg outline-none"
                    >

                </div>

            </div>


            <!-- =====================================================
                 색상
            ====================================================== -->

            <div>

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    책등 & 띠 컬러
                </label>


                <div class="flex flex-wrap gap-2.5">


                    <button
                        type="button"
                        class="color-chip selected w-8 h-8 rounded-full
                               border-2 border-white shadow-md
                               ring-2 ring-indigo-600 ring-offset-2"
                        style="background:#A61D4B"
                        data-color="#A61D4B"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#1E3A8A"
                        data-color="#1E3A8A"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#065F46"
                        data-color="#065F46"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#581C87"
                        data-color="#581C87"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#B45309"
                        data-color="#B45309"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#111827"
                        data-color="#111827"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#0369A1"
                        data-color="#0369A1"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#9A3412"
                        data-color="#9A3412"
                    ></button>


                    <button
                        type="button"
                        class="color-chip w-8 h-8 rounded-full
                               border-2 border-white shadow-md"
                        style="background:#4D7C0F"
                        data-color="#4D7C0F"
                    ></button>


                </div>

            </div>

        </div>


        <!-- 다운로드 -->

        <button
            id="downloadBtn"
            class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700
                   text-white font-semibold py-3 rounded-xl
                   transition shadow-md"
        >
            ✨ 고화질 투명 PNG 다운로드
        </button>

    </div>



    <!-- =============================================================
         오른쪽 미리보기
    ============================================================== -->

    <div
        class="p-6 md:p-8 bg-slate-50 flex flex-col
               items-center justify-start overflow-auto"
    >

        <p class="text-xs font-medium text-slate-400 mb-3">
            실시간 미리보기 · 54:86 · 사진 45%
        </p>


        <div class="preview-frame">


            <!-- =====================================================
                 실제 캔버스
                 1080 × 1720
            ====================================================== -->

            <div
                id="captureArea"
                class="book-canvas"
            >


                <!-- =================================================
                     ★★★★★ 책등 ★★★★★

                     97 × 1720

                     상하단 흰색 부분은 투명
                ================================================== -->

                <div
                    id="spine"
                    style="
                        width:97px;
                        height:1720px;

                        position:relative;

                        flex-shrink:0;

                        background:transparent;
                    "
                >


                    <!-- =================================================
                         책등 상단

                         ★ 흰색 배경 제거
                         ★ 완전 투명

                         번호와 봉산삼오전집만 표시
                    ================================================== -->

                    <div
                        style="
                            position:absolute;

                            top:0;
                            left:0;

                            width:97px;
                            height:170px;

                            background:transparent;
                        "
                    >


                        <!-- =================================================
                             번호

                             기존보다 2배
                        ================================================== -->

                        <div
                            class="font-sans-kr"
                            style="
                                position:absolute;

                                top:25px;
                                left:0;

                                width:97px;

                                text-align:center;

                                font-size:34px;

                                line-height:1;

                                font-weight:700;

                                color:#111111;
                            "
                        >

                            <span id="previewSeriesNo">
                                088
                            </span>

                        </div>


                        <!-- =================================================
                             봉산삼오전집

                             기존보다 2배
                        ================================================== -->

                        <div
                            class="font-sans-kr"
                            style="
                                position:absolute;

                                top:76px;
                                left:0;

                                width:97px;

                                text-align:center;

                                font-size:26px;

                                line-height:1.05;

                                font-weight:700;

                                color:#111111;
                            "
                        >

                            봉산<br>
                            삼오<br>
                            전집

                        </div>


                    </div>



                    <!-- =================================================
                         ★★★★★ 작가 사진 ★★★★★

                         170px ~ 320px

                         사진 바로 다음에 컬러 영역
                         → 중간 흰색 여백 없음
                    ================================================== -->

                    <div
                        style="
                            position:absolute;

                            top:170px;
                            left:0;

                            width:97px;
                            height:150px;

                            overflow:hidden;

                            background:#e5e7eb;
                        "
                    >

                        <img
                            id="portraitImg"
                            src="Jane.png"
                            alt="작가 초상"
                            style="
                                display:block;

                                width:100%;
                                height:100%;

                                object-fit:cover;

                                filter:
                                    grayscale(100%)
                                    contrast(115%);
                            "
                        >

                    </div>



                    <!-- =================================================
                         ★★★★★ 책등 컬러 영역 ★★★★★

                         ★ 사진 끝 = 320px
                         ★ 컬러 시작 = 320px

                         → 흰색 틈 0px
                    ================================================== -->

                    <div
                        id="spineColorBox"
                        style="
                            position:absolute;

                            top:320px;
                            left:0;

                            width:97px;
                            height:1140px;

                            background:#A61D4B;

                            overflow:hidden;
                        "
                    >


                        <!-- =================================================
                             큰 제목

                             ★ 기존보다 1.5배
                             30px → 45px
                             ★ 세로 한 열
                        ================================================== -->

                        <div
                            id="spineTitleBox"
                            style="
                                position:absolute;

                                top:45px;
                                left:0;

                                width:97px;

                                display:flex;

                                justify-content:center;

                                align-items:flex-start;
                            "
                        >

                            <span
                                id="previewSpineTitle"
                                class="spine-vertical font-batang"
                                style="
                                    color:#ffffff;

                                    font-size:45px;

                                    font-weight:700;

                                    line-height:1;

                                    letter-spacing:0.01em;

                                    white-space:nowrap !important;

                                    max-height:none !important;
                                "
                            >
                                오만과 편견
                            </span>

                        </div>



                        <!-- =================================================
                             작은 저자

                             ★ 기존보다 1.5배
                             16px → 24px

                             제목 바로 아래
                        ================================================== -->

                        <div
                            id="spineAuthorBox"
                            style="
                                position:absolute;

                                top:720px;
                                left:0;

                                width:97px;

                                display:flex;

                                justify-content:center;

                                align-items:flex-start;
                            "
                        >

                            <span
                                id="previewSpineAuthor"
                                class="spine-vertical font-sans-kr"
                                style="
                                    color:#ffffff;

                                    font-size:24px;

                                    font-weight:500;

                                    line-height:1;

                                    letter-spacing:0.04em;

                                    white-space:nowrap !important;

                                    max-height:none !important;
                                "
                            >
                                제인 오스틴
                            </span>

                        </div>


                    </div>



                    <!-- =================================================
                         책등 하단

                         ★ 흰색 배경 없음
                         ★ 완전 투명
                         ★ 민음사 PNG만 표시
                    ================================================== -->

                    <div
                        style="
                            position:absolute;

                            left:0;
                            bottom:0;

                            width:97px;
                            height:260px;

                            background:transparent;

                            display:flex;

                            align-items:flex-end;

                            justify-content:center;

                            padding-bottom:58px;
                        "
                    >

                        <img
                            src="./minumsa.png"
                            alt="민음사"
                            class="minumsa-logo"
                            style="
                                width:70px;
                                height:40px;
                            "
                        >

                    </div>


                </div>



                <!-- =================================================
                     ★★★★★ 앞표지 ★★★★★

                     983 × 1720
                ================================================== -->

                <div
                    id="frontCover"
                    style="
                        width:983px;
                        height:1720px;

                        position:relative;

                        flex-shrink:0;

                        background:transparent;
                    "
                >


                    <!-- =================================================
                         ★★★★★ 일러스트 ★★★★★

                         1720 × 45%
                         = 774px

                         ★ 앞표지에서만 존재
                         ★ 책등 침범 없음
                    ================================================== -->

                    <div
                        style="
                            position:absolute;

                            top:0;
                            left:0;

                            width:983px;
                            height:774px;

                            overflow:hidden;

                            background:transparent;
                        "
                    >

                        <img
                            id="previewImage"
                            src=""
                            alt=""
                            style="
                                display:none;

                                width:100%;
                                height:100%;

                                object-fit:cover;
                            "
                        >


                        <div
                            id="imagePlaceholder"
                            class="font-sans-kr"
                            style="
                                position:absolute;

                                inset:0;

                                display:flex;

                                align-items:center;
                                justify-content:center;

                                background:#f8fafc;

                                color:#94a3b8;

                                font-size:20px;
                            "
                        >
                            앞표지 일러스트 · 45%
                        </div>

                    </div>



                    <!-- =================================================
                         ★ 앞표지 하단 55%

                         946px

                         ★ 전체 투명
                    ================================================== -->

                    <div
                        style="
                            position:absolute;

                            top:774px;
                            left:0;

                            width:983px;
                            height:946px;

                            background:transparent;
                        "
                    >


                        <!-- =================================================
                             앞표지 텍스트
                        ================================================== -->

                        <div
                            style="
                                position:absolute;

                                left:59px;
                                top:42px;

                                width:700px;
                            "
                        >


                            <!-- ---------------------------------------------
                                 봉산삼오전집
                            ---------------------------------------------- -->

                            <div
                                class="font-sans-kr"
                                style="
                                    margin-left:17px;

                                    font-size:22px;

                                    line-height:1;

                                    font-weight:700;

                                    color:#111111;
                                "
                            >

                                봉산삼오전집

                                <span id="previewSubSeriesNo">
                                    088
                                </span>

                            </div>



                            <!-- =================================================
                                 위쪽 색띠

                                 ★ 제목 길이에 따라 JS로 조절
                                 ★ 기본 길이는 기존의 1.4배
                                   500 × 1.4 = 700px
                            ================================================== -->

                            <div
                                id="topBar"
                                style="
                                    width:700px;

                                    height:55px;

                                    margin-top:28px;

                                    background:#A61D4B;
                                "
                            >
                            </div>



                            <!-- =================================================
                                 앞표지 제목

                                 ★ 짧으면 1줄
                                 ★ 길면 글자 크기 축소
                                 ★ 그래도 안 되면 2줄
                                 ★ 2줄 줄간격 매우 좁게
                            ================================================== -->

                            <div
                                id="previewBookTitle"
                                class="font-batang"
                                style="
                                    width:700px;

                                    margin-top:28px;
                                    margin-bottom:29px;

                                    font-size:69px;

                                    line-height:0.98;

                                    font-weight:400;

                                    letter-spacing:-0.055em;

                                    color:#111111;

                                    word-break:keep-all;

                                    white-space:nowrap;

                                    overflow:hidden;
                                "
                            >
                                오만과 편견
                            </div>



                            <!-- =================================================
                                 아래쪽 색띠

                                 ★ 위쪽과 항상 동일 길이
                            ================================================== -->

                            <div
                                id="bottomBar"
                                style="
                                    width:700px;

                                    height:55px;

                                    display:flex;

                                    align-items:center;

                                    padding-left:21px;

                                    background:#A61D4B;
                                "
                            >

                                <span
                                    id="previewEngTitle"
                                    class="font-sans-kr"
                                    style="
                                        color:#ffffff;

                                        font-size:19px;

                                        font-weight:500;

                                        white-space:nowrap;

                                        overflow:hidden;

                                        text-overflow:ellipsis;

                                        max-width:658px;
                                    "
                                >
                                    Pride and Prejudice
                                </span>

                            </div>



                            <!-- =================================================
                                 저자 / 역자
                            ================================================== -->

                            <div
                                class="font-sans-kr"
                                style="
                                    display:flex;

                                    align-items:baseline;

                                    margin-top:29px;

                                    margin-left:17px;
                                "
                            >

                                <span
                                    id="previewAuthor"
                                    style="
                                        font-size:27px;

                                        font-weight:700;

                                        color:#111111;

                                        white-space:nowrap;
                                    "
                                >
                                    제인 오스틴
                                </span>


                                <span
                                    id="previewTranslator"
                                    style="
                                        font-size:18px;

                                        font-weight:400;

                                        color:#111111;

                                        margin-left:17px;

                                        white-space:nowrap;
                                    "
                                >
                                    윤지관, 전승희 옮김
                                </span>

                            </div>


                        </div>



                        <!-- =================================================
                             앞표지 하단 민음사

                             ★ 주변은 투명
                        ================================================== -->

                        <div
                            style="
                                position:absolute;

                                left:59px;
                                bottom:61px;

                                display:flex;

                                align-items:center;
                            "
                        >

                            <img
                                src="./minumsa.png"
                                alt="민음사"
                                class="minumsa-logo"
                                style="
                                    width:76px;
                                    height:42px;
                                "
                            >

                        </div>


                    </div>


                </div>


            </div>

        </div>


        <p class="text-[11px] text-slate-400 mt-4 text-center">
            ※ 최종 PNG 1080×1720px · 54:86 · 사진 45% · 나머지 영역 투명
        </p>

    </div>

</div>



<script>


    /* =============================================================
       입력 요소
    ============================================================= */

    const seriesNoInput =
        document.getElementById('seriesNoInput');

    const commonTitleInput =
        document.getElementById('commonTitleInput');

    const engTitleInput =
        document.getElementById('engTitleInput');

    const authorInput =
        document.getElementById('authorInput');

    const translatorInput =
        document.getElementById('translatorInput');

    const imageInput =
        document.getElementById('imageInput');

    const authorImageSelect =
        document.getElementById('authorImageSelect');


    /* =============================================================
       미리보기 요소
    ============================================================= */

    const previewSeriesNo =
        document.getElementById('previewSeriesNo');

    const previewSubSeriesNo =
        document.getElementById('previewSubSeriesNo');

    const previewSpineTitle =
        document.getElementById('previewSpineTitle');

    const previewSpineAuthor =
        document.getElementById('previewSpineAuthor');

    const previewBookTitle =
        document.getElementById('previewBookTitle');

    const previewEngTitle =
        document.getElementById('previewEngTitle');

    const previewAuthor =
        document.getElementById('previewAuthor');

    const previewTranslator =
        document.getElementById('previewTranslator');

    const previewImage =
        document.getElementById('previewImage');

    const imagePlaceholder =
        document.getElementById('imagePlaceholder');

    const portraitImg =
        document.getElementById('portraitImg');

    const spineColorBox =
        document.getElementById('spineColorBox');

    const spineTitleBox =
        document.getElementById('spineTitleBox');

    const spineAuthorBox =
        document.getElementById('spineAuthorBox');

    const topBar =
        document.getElementById('topBar');

    const bottomBar =
        document.getElementById('bottomBar');

    const colorChips =
        document.querySelectorAll('.color-chip');

    const downloadBtn =
        document.getElementById('downloadBtn');

    const captureArea =
        document.getElementById('captureArea');



    /* =============================================================
       번호 포맷
    ============================================================= */

    function formatSeriesNo(value) {

        const number =
            parseInt(value, 10);

        if (
            isNaN(number) ||
            number <= 0
        ) {

            return '001';

        }

        return String(number).padStart(3, '0');

    }



    /* =============================================================
       번호 변경
    ============================================================= */

    seriesNoInput.addEventListener(
        'input',
        function(e) {

            const value =
                formatSeriesNo(e.target.value);

            previewSeriesNo.textContent =
                value;

            previewSubSeriesNo.textContent =
                value;

        }
    );



    /* =============================================================
       작가 사진 변경
    ============================================================= */

    authorImageSelect.addEventListener(
        'change',
        function(e) {

            portraitImg.src =
                e.target.value;

        }
    );



    /* =============================================================
       제목 자동 맞춤

       ★ 중요

       제목이 길어지면:

       1단계:
       글자 크기를 줄인다.

       2단계:
       그래도 안 들어가면 2줄로 바꾼다.

       3단계:
       2줄에서도 줄간격을 아주 좁게 한다.

       4단계:
       색띠보다 제목이 절대 길어지지 않는다.
    ============================================================= */

    function fitTitleAndBars() {

        const MAX_WIDTH = 700;

        const MIN_FONT_SIZE = 38;

        const NORMAL_FONT_SIZE = 69;

        const BAR_PADDING = 0;


        let fontSize =
            NORMAL_FONT_SIZE;


        /*
         * 우선 1줄로 시작
         */

        previewBookTitle.style.whiteSpace =
            'nowrap';

        previewBookTitle.style.width =
            MAX_WIDTH + 'px';

        previewBookTitle.style.fontSize =
            fontSize + 'px';

        previewBookTitle.style.lineHeight =
            '1';



        /*
         * 1줄로 들어갈 때까지
         * 글자를 줄인다.
         */

        while (
            previewBookTitle.scrollWidth > MAX_WIDTH &&
            fontSize > MIN_FONT_SIZE
        ) {

            fontSize -= 1;

            previewBookTitle.style.fontSize =
                fontSize + 'px';

        }



        /*
         * 그래도 안 들어가는 아주 긴 제목이면
         * 2줄 허용
         */

        if (
            previewBookTitle.scrollWidth > MAX_WIDTH
        ) {

            previewBookTitle.style.whiteSpace =
                'normal';

            previewBookTitle.style.width =
                MAX_WIDTH + 'px';

            previewBookTitle.style.lineHeight =
                '0.88';

            previewBookTitle.style.overflow =
                'hidden';

            /*
             * 두 줄 이상은 만들지 않음
             */

            previewBookTitle.style.display =
                '-webkit-box';

            previewBookTitle.style.webkitBoxOrient =
                'vertical';

            previewBookTitle.style.webkitLineClamp =
                '2';

        }

        else {

            previewBookTitle.style.whiteSpace =
                'nowrap';

            previewBookTitle.style.display =
                'block';

            previewBookTitle.style.webkitLineClamp =
                'unset';

            previewBookTitle.style.lineHeight =
                '1';

        }



        /*
         * 제목의 실제 표시 폭을 측정
         */

        const titleWidth =
            Math.min(
                MAX_WIDTH,
                Math.max(
                    100,
                    previewBookTitle.scrollWidth
                )
            );


        /*
         * 색띠 길이

         * 기본은 700px.
         *
         * 짧은 제목이어도
         * 700px보다 줄어들지 않게 함.
         *
         * 긴 제목이면 제목까지 늘어남.
         */

        const barWidth =
            Math.max(
                700,
                titleWidth + BAR_PADDING
            );


        /*
         * 앞표지 최대 폭
         */

        const finalBarWidth =
            Math.min(
                900,
                barWidth
            );


        /*
         * 위 / 아래 색띠 동일 길이
         */

        topBar.style.width =
            finalBarWidth + 'px';

        bottomBar.style.width =
            finalBarWidth + 'px';


        /*
         * 영문 제목도 띠 밖으로 나가지 않도록
         */

        previewEngTitle.style.maxWidth =
            Math.max(
                50,
                finalBarWidth - 42
            ) + 'px';

    }



    /* =============================================================
       책등 제목/저자 위치

       제목 아래에 작은 저자가 붙도록
    ============================================================= */

    function fitSpineAuthor() {

        /*
         * 실제 세로 제목 높이를 가져옴
         */

        const titleRect =
            previewSpineTitle.getBoundingClientRect();


        const scale =
            0.465;


        const titleHeight =
            titleRect.height / scale;


        /*
         * 제목 시작 위치
         */

        const titleTop =
            45;


        /*
         * 제목과 저자 사이 간격
         */

        const gap =
            35;


        /*
         * 저자 위치
         */

        let authorTop =
            titleTop +
            titleHeight +
            gap;


        /*
         * 너무 아래로 내려가지 않도록
         */

        authorTop =
            Math.min(
                authorTop,
                850
            );


        spineAuthorBox.style.top =
            authorTop + 'px';

    }



    /* =============================================================
       제목 입력
    ============================================================= */

    commonTitleInput.addEventListener(
        'input',
        function(e) {

            const value =
                e.target.value ||
                '오만과 편견';


            previewBookTitle.textContent =
                value;


            previewSpineTitle.textContent =
                value;


            fitTitleAndBars();

            fitSpineAuthor();

        }
    );



    /* =============================================================
       영문 제목
    ============================================================= */

    engTitleInput.addEventListener(
        'input',
        function(e) {

            previewEngTitle.textContent =
                e.target.value ||
                'Pride and Prejudice';

        }
    );



    /* =============================================================
       저자
    ============================================================= */

    authorInput.addEventListener(
        'input',
        function(e) {

            const value =
                e.target.value ||
                '제인 오스틴';


            previewAuthor.textContent =
                value;


            previewSpineAuthor.textContent =
                value;


            fitSpineAuthor();

        }
    );



    /* =============================================================
       역자
    ============================================================= */

    translatorInput.addEventListener(
        'input',
        function(e) {

            previewTranslator.textContent =
                e.target.value;

        }
    );



    /* =============================================================
       일러스트 업로드

       ★ 앞표지에만 적용
    ============================================================= */

    imageInput.addEventListener(
        'change',
        function(e) {

            const file =
                e.target.files[0];

            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    previewImage.src =
                        event.target.result;

                    previewImage.style.display =
                        'block';

                    imagePlaceholder.style.display =
                        'none';

                };


            reader.readAsDataURL(file);

        }
    );



    /* =============================================================
       컬러 변경
    ============================================================= */

    colorChips.forEach(
        function(chip) {

            chip.addEventListener(
                'click',
                function() {


                    colorChips.forEach(
                        function(c) {

                            c.classList.remove(
                                'selected',
                                'ring-2',
                                'ring-indigo-600',
                                'ring-offset-2'
                            );

                        }
                    );


                    chip.classList.add(
                        'selected',
                        'ring-2',
                        'ring-indigo-600',
                        'ring-offset-2'
                    );


                    const color =
                        chip.dataset.color;


                    spineColorBox.style.backgroundColor =
                        color;


                    topBar.style.backgroundColor =
                        color;


                    bottomBar.style.backgroundColor =
                        color;

                }
            );

        }
    );



    /* =============================================================
       PNG 다운로드

       ★ 1080 × 1720
       ★ 54:86
       ★ 투명 PNG
    ============================================================= */

    downloadBtn.addEventListener(
        'click',
        async function() {


            const originalTransform =
                captureArea.style.transform;


            downloadBtn.disabled =
                true;


            downloadBtn.textContent =
                '✨ PNG 생성 중...';


            try {


                /*
                 * 미리보기 확대를 제거하고
                 * 실제 1080 × 1720으로 캡처
                 */

                captureArea.style.transform =
                    'none';


                /*
                 * 이미지 로딩 대기
                 */

                const images =
                    captureArea.querySelectorAll('img');


                await Promise.all(
                    Array.from(images).map(
                        function(img) {

                            if (
                                img.complete
                            ) {

                                return Promise.resolve();

                            }

                            return new Promise(
                                function(resolve) {

                                    img.onload =
                                        resolve;

                                    img.onerror =
                                        resolve;

                                }
                            );

                        }
                    )
                );


                /*
                 * 실제 PNG 생성
                 */

                const canvas =
                    await html2canvas(
                        captureArea,
                        {

                            width:1080,

                            height:1720,

                            scale:1,

                            /*
                             * ★★★ 핵심 ★★★
                             *
                             * null = 투명
                             */

                            backgroundColor:null,

                            useCORS:true,

                            allowTaint:false,

                            imageTimeout:0

                        }
                    );


                /*
                 * 미리보기 복구
                 */

                captureArea.style.transform =
                    originalTransform;


                /*
                 * PNG 저장
                 */

                const link =
                    document.createElement('a');


                link.download =
                    '봉산삼오전집_책갈피.png';


                link.href =
                    canvas.toDataURL(
                        'image/png'
                    );


                link.click();


            }

            catch(error) {

                console.error(error);


                captureArea.style.transform =
                    originalTransform;


                alert(
                    'PNG 생성 중 오류가 발생했습니다.'
                );

            }


            finally {

                downloadBtn.disabled =
                    false;

                downloadBtn.textContent =
                    '✨ 고화질 투명 PNG 다운로드';

            }

        }
    );



    /* =============================================================
       최초 실행
    ============================================================= */

    window.addEventListener(
        'load',
        function() {

            fitTitleAndBars();

            fitSpineAuthor();

        }
    );


</script>

</body>
</html>
